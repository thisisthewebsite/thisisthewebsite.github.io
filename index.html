<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#07070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(1200px 700px at 50% 35%,#14141c,#07070a 70%);z-index:10;transition:opacity .8s ease,visibility .8s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .mark{font-size:15px;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;padding-left:.5em}
#connect{appearance:none;border:0;cursor:pointer;background:#1db954;color:#04140a;font-size:15px;font-weight:800;letter-spacing:.04em;padding:17px 44px;border-radius:999px;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
#connect:hover{transform:scale(1.04);box-shadow:0 12px 44px rgba(29,185,84,.35)}
#connect:active{transform:scale(.98)}
#player{position:fixed;inset:0;opacity:0;transition:opacity 1s ease}
#player.on{opacity:1}
.bg{position:absolute;inset:-6%;z-index:0}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(90px) brightness(.38) saturate(1.6);transform:scale(1.08);opacity:0;transition:opacity 1.4s ease}
.bg img.show{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.45) 100%)}
.stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;gap:6vw;padding:0 7vw}
.left{width:min(30vw,420px);flex-shrink:0}
#art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.5);display:block;background:#111}
.meta{margin-top:26px}
#title{font-size:clamp(17px,1.4vw,22px);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{margin-top:6px;font-size:clamp(14px,1.1vw,17px);font-weight:500;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{margin-top:22px;height:14px;display:flex;align-items:center;cursor:pointer}
.bar::before{content:"";position:absolute}
.track{position:relative;width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
#fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:3px;background:#fff;transition:width .3s linear}
.times{margin-top:9px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
.right{flex:1;height:80vh;position:relative;overflow:hidden}
.right::before,.right::after{content:"";position:absolute;left:0;right:0;height:20vh;z-index:2;pointer-events:none}
.right::before{top:0;background:linear-gradient(rgba(7,7,10,.85),transparent)}
.right::after{bottom:0;background:linear-gradient(transparent,rgba(7,7,10,.85))}
#lyrics{position:absolute;left:0;right:0;top:0;will-change:transform;transition:transform .55s cubic-bezier(.22,.8,.24,1)}
.line{font-size:clamp(24px,3.1vw,46px);line-height:1.22;font-weight:800;letter-spacing:-.015em;color:rgba(255,255,255,.30);padding:.32em 0;max-width:24ch;transform-origin:left center;transition:color .45s ease,opacity .45s ease,filter .55s ease,transform .55s cubic-bezier(.22,.8,.24,1)}
.line.past{color:rgba(255,255,255,.16)}
.line.near{color:rgba(255,255,255,.48)}
.line.far{color:rgba(255,255,255,.28);filter:blur(3px);opacity:.5}
.line.active{color:#fff;transform:scale(1.05)}
#empty{position:relative;z-index:1;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#empty .t{font-size:20px;font-weight:700;color:rgba(255,255,255,.8)}
#empty .s{font-size:14px;color:rgba(255,255,255,.4)}
#nolyrics{font-size:clamp(20px,2vw,30px);font-weight:700;color:rgba(255,255,255,.35)}
@media (max-width:900px){
.stage{flex-direction:column;justify-content:center;gap:5vh;padding:0 8vw}
.left{width:min(52vw,300px)}
.meta{margin-top:18px}
.right{width:100%;flex:1;min-height:0;height:auto;max-height:38vh}
.line{max-width:100%}
}
</style>
</head>
<body>
<div id="intro">
<div class="mark">Now Playing</div>
<button id="connect">Connect to Spotify</button>
</div>
<div id="player">
<div class="bg"><img id="bgA" alt=""><img id="bgB" alt=""></div>
<div class="stage" id="stage">
<div class="left">
<img id="art" alt="">
<div class="meta">
<div id="title"></div>
<div id="artist"></div>
<div class="bar" id="bar"><div class="track"><div id="fill"></div></div></div>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
</div>
</div>
<div class="right" id="right"><div id="lyrics"></div></div>
</div>
<div id="empty"><div class="t">Nothing playing</div><div class="s">Start a song on Spotify and it will appear here.</div></div>
</div>
<script>
const CLIENT_ID="c361237077b7462180c155eafff8aeda";
const SCOPES=["user-read-currently-playing","user-read-playback-state","user-modify-playback-state"].join(" ");
const REDIRECT=location.origin+location.pathname;
const LYRICS_OFFSET_MS=0;
const $=id=>document.getElementById(id);
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
function b64url(a){return btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function pkce(){const v=b64url(crypto.getRandomValues(new Uint8Array(64)));const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return{v,c:b64url(h)}}
async function authorize(){const{v,c}=await pkce();store.set("pkce_verifier",v);const u=new URL("https://accounts.spotify.com/authorize");u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("response_type","code");u.searchParams.set("redirect_uri",REDIRECT);u.searchParams.set("scope",SCOPES);u.searchParams.set("code_challenge_method","S256");u.searchParams.set("code_challenge",c);location.href=u}
async function token(body){const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok)throw 0;return r.json()}
async function exchange(code){const d=await token(new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:store.get("pkce_verifier")||""}));store.del("pkce_verifier");saveToken(d)}
function saveToken(d){store.set("spotify_token",{access:d.access_token,refresh:d.refresh_token,exp:Date.now()+d.expires_in*1000-30000})}
async function refresh(){const t=store.get("spotify_token");const d=await token(new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:t.refresh}));t.access=d.access_token;if(d.refresh_token)t.refresh=d.refresh_token;t.exp=Date.now()+d.expires_in*1000-30000;store.set("spotify_token",t)}
async function api(path,opts={}){const t=store.get("spotify_token");if(!t)return null;if(Date.now()>t.exp){try{await refresh()}catch(e){store.del("spotify_token");showIntro();return null}}const r=await fetch("https://api.spotify.com/v1"+path,{...opts,headers:{Authorization:"Bearer "+store.get("spotify_token").access,"Content-Type":"application/json"}});if(r.status===401){try{await refresh()}catch(e){}const r2=await fetch("https://api.spotify.com/v1"+path,{...opts,headers:{Authorization:"Bearer "+store.get("spotify_token").access,"Content-Type":"application/json"}});return r2}return r}
function showIntro(){$("intro").classList.remove("gone");$("player").classList.remove("on")}
function showPlayer(){$("intro").classList.add("gone");$("player").classList.add("on")}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let state={id:null,title:"",artist:"",album:"",art:"",duration:0,position:0,at:0,playing:false};
let lines=[],bgFlip=false,lyricIdx=-1,trackToken="";
function swapBg(src){const a=$("bgA"),b=$("bgB");const showEl=bgFlip?a:b,hidEl=bgFlip?b:a;showEl.src=src;showEl.classList.add("show");hidEl.classList.remove("show");bgFlip=!bgFlip}
function setTrack(item,prog,playing){const t=item;if(t.id!==state.id){state={id:t.id,title:t.name,artist:t.artists.map(a=>a.name).join(", "),album:t.album.name,art:(t.album.images[0]||{}).url||"",duration:t.duration_ms,position:prog,at:performance.now(),playing};$("art").src=state.art;$("title").textContent=state.title;$("artist").textContent=state.artist;$("dur").textContent=fmt(state.duration);swapBg(state.art);trackToken=state.id+"|"+state.title+"|"+state.artist+"|"+Math.round(state.duration/1000);loadLyrics()}else{state.position=prog;state.at=performance.now();state.playing=playing}}
function noTrack(){if(state.id!==null){state.id=null;lines=[];$("lyrics").innerHTML="";$("stage").style.display="none";$("empty").style.display="flex"}}
function parseLRC(raw){if(!raw)return null;const out=[];for(const row of raw.split(/\r?\n/)){const m=row.match(/\[(\d+):(\d+(?:\.\d+)?)\]/g);if(!m)continue;const text=row.replace(/\[[^\]]*\]/g,"").trim();if(!text)continue;if(/^[\(\[][^)\]]*[\)\]]$/.test(text)&&text.replace(/[\(\)\[\]]/g,"").trim().split(/\s+/).length<=5)continue;const t=Math.round(parseInt(m[m.length-1].match(/\d+/)[0],10)*60000+parseFloat(m[m.length-1].match(/:(\d+(?:\.\d+)?)\]/)[1])*1000);out.push({t:t+LYRICS_OFFSET_MS,text})}out.sort((a,b)=>a.t-b.t);return out.length?out:null}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim()}
async function loadLyrics(){const tok=trackToken;const durS=Math.round(state.duration/1000);let sync=null;try{const g=new URLSearchParams({track_name:state.title,artist_name:state.artist,album_name:state.album,duration:durS});const r=await fetch("https://lrclib.net/api/get?"+g);if(r.ok)sync=(await r.json()).syncedLyrics;if(!sync){const s=await fetch("https://lrclib.net/api/search?"+new URLSearchParams({track_name:state.title,artist_name:state.artist}));if(s.ok){const arr=await s.json();const nT=norm(state.title),nA=norm(state.artist);const hit=arr.find(x=>norm(x.trackName)===nT&&norm(x.artistName).includes(nA.split(" ")[0])&&Math.abs(x.duration-durS)<4)||arr.find(x=>norm(x.trackName)===nT&&Math.abs(x.duration-durS)<4);if(hit)sync=hit.syncedLyrics}}}catch(e){}
if(tok!==trackToken)return;lines=parseLRC(sync)||[];renderLyrics();lyricIdx=-1}
function renderLyrics(){const c=$("lyrics");c.innerHTML="";c.style.transform="translateY(0)";if(!lines.length){c.innerHTML='<div id="nolyrics">Lyrics unavailable</div>';return}const frag=document.createDocumentFragment();for(const l of lines){const d=document.createElement("div");d.className="line past";d.textContent=l.text;frag.appendChild(d)}c.appendChild(frag)}
function position(){return state.playing?Math.min(state.position+(performance.now()-state.at),state.duration):state.position}
function tick(){if(state.id===null)return;const pos=position();$("fill").style.width=(pos/state.duration*100)+"%";$("cur").textContent=fmt(pos);let idx=-1;for(let i=0;i<lines.length;i++){if(lines[i].t<=pos+140)idx=i;else break}if(idx!==lyricIdx){lyricIdx=idx;updateLines(idx)}requestAnimationFrame(tick)}
function updateLines(idx){const c=$("lyrics");const kids=c.children;if(!kids.length||c.querySelector("#nolyrics"))return;for(let i=0;i<kids.length;i++){const k=kids[i];k.classList.remove("active","past","near","far");const d=i-idx;if(i<idx)k.classList.add("past");else if(d===0)k.classList.add("active");else if(d<=2)k.classList.add("near");else k.classList.add("far")}const h=$("right").clientHeight;let y=0;for(let i=0;i<idx;i++)y+=kids[i].offsetHeight;const activeH=kids[idx]?kids[idx].offsetHeight:0;c.style.transform="translateY("+(h/2-y-activeH/2)+"px)"}
async function poll(){const r=await api("/me/player/currently-playing");if(!r){return}if(r.status===204){noTrack();return}try{const d=await r.json();if(!d||!d.item){noTrack();return}$("stage").style.display="";$("empty").style.display="none";setTrack(d.item,d.progress_ms,d.is_playing)}catch(e){}}
$("bar").addEventListener("click",async e=>{if(state.id===null)return;const r=$("bar").getBoundingClientRect();const pct=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));const ms=Math.round(pct*state.duration);state.position=ms;state.at=performance.now();const q=await api("/me/player/seek?position_ms="+ms,{method:"PUT"})});
$("connect").addEventListener("click",authorize);
(async()=>{const u=new URLSearchParams(location.search);const code=u.get("code");if(code){history.replaceState(null,"",REDIRECT);try{await exchange(code)}catch(e){}}const t=store.get("spotify_token");if(!t||!t.access){showIntro();return}showPlayer();await poll();setInterval(poll,1500);requestAnimationFrame(tick)})();
</script>
</body>
</html>
