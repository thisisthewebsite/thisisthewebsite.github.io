<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>Afterglow — Spotify Lyrics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--fg:#f5f5f7;--muted:rgba(245,245,247,.48);--line:rgba(255,255,255,.13);--glass:rgba(12,14,22,.48)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090b12;color:var(--fg);font-family:'DM Sans',sans-serif}
body{min-height:100vh;overflow:hidden}
button{font:inherit}
#ambient{position:fixed;inset:-12%;z-index:0;background:radial-gradient(ellipse at 22% 35%,#334b74 0%,transparent 42%),radial-gradient(ellipse at 78% 68%,#442d55 0%,transparent 42%),linear-gradient(120deg,#101a32,#090b12 65%);filter:blur(54px);transform:scale(1.1);transition:background 1.2s ease}
#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(90deg,rgba(4,6,12,.56),rgba(4,6,12,.22) 48%,rgba(4,6,12,.58)),linear-gradient(0deg,rgba(4,6,12,.42),transparent 55%);pointer-events:none}
main{position:relative;z-index:2;min-height:100vh}
#connect{min-height:100vh;display:grid;place-items:center;padding:28px}
.connect-card{text-align:center;max-width:420px;width:100%}
.wordmark{font:800 13px 'Manrope',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:54px}
.connect-card h1{font:700 clamp(34px,5vw,52px)/1.08 'Manrope',sans-serif;letter-spacing:-.055em;margin:0 0 16px}
.connect-card p{font-size:15px;line-height:1.7;color:var(--muted);margin:0 auto 32px;max-width:330px}
.primary{border:0;border-radius:999px;padding:15px 27px;background:#f5f5f7;color:#101116;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s}
.primary:hover{transform:translateY(-2px)}
#app{display:none;min-height:100vh;padding:clamp(24px,5vw,76px) clamp(22px,7vw,112px);align-items:center}
.layout{width:min(1280px,100%);margin:auto;display:grid;grid-template-columns:minmax(300px,470px) minmax(360px,1fr);gap:clamp(54px,8vw,132px);align-items:center}
.left{min-width:0}
.cover-wrap{width:min(100%,440px);aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 28px 90px rgba(0,0,0,.35);position:relative}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.cover-wrap:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:inherit;pointer-events:none}
.track-meta{padding:22px 2px 0;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.track-copy{min-width:0}
.track-title{font:700 clamp(19px,2vw,24px)/1.25 'Manrope',sans-serif;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:rgba(255,255,255,.62);font-size:15px;margin-top:5px}
.album{color:rgba(255,255,255,.38);font-size:12px;margin-top:4px}
.status{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.46);white-space:nowrap;padding-top:6px}
.progress-area{margin-top:29px}
.progress{height:3px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.progress-fill{height:100%;width:0;background:#f5f5f7;border-radius:4px;transition:width .35s linear}
.times{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:rgba(255,255,255,.52);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:26px}
.control{width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:rgba(255,255,255,.78);cursor:pointer;padding:0}
.control svg{width:19px;height:19px;fill:currentColor}
.control.main-control{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.94);color:#11131a}
.control.main-control svg{width:19px;height:19px}
.right{min-width:0;height:min(70vh,700px);position:relative;overflow:hidden}
.lyrics-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.lyrics-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.lyrics-state{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.08em}
.lyrics-window{height:calc(100% - 42px);overflow:hidden;position:relative;mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 82%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 82%,transparent 100%)}
#lyrics{position:absolute;left:0;right:0;top:42%;transform:translateY(0);transition:transform .55s cubic-bezier(.2,.75,.25,1);padding:0 0 40px}
.lyric-line{font:800 clamp(26px,3.15vw,43px)/1.28 'Manrope',sans-serif;letter-spacing:-.045em;color:rgba(255,255,255,.2);margin:0 0 25px;transition:color .35s,opacity .35s,filter .35s;max-width:850px;overflow-wrap:anywhere}
.lyric-line.active{color:#fff}
.lyric-line.past{color:rgba(255,255,255,.33)}
.lyric-line .word{display:inline;transition:color .12s}
.lyric-line .word.sung{color:#fff}
.lyric-line .word.unsung{color:rgba(255,255,255,.44)}
.empty{font:700 clamp(26px,3vw,40px)/1.25 'Manrope',sans-serif;letter-spacing:-.04em;color:rgba(255,255,255,.75);max-width:560px}
#message{font-size:12px;line-height:1.6;color:rgba(255,255,255,.45);margin-top:14px}
#disconnect{position:fixed;right:26px;top:24px;z-index:5;border:1px solid var(--line);background:rgba(0,0,0,.18);color:rgba(255,255,255,.62);border-radius:99px;padding:8px 13px;font-size:11px;cursor:pointer;display:none}
@media(max-width:800px){
 body{overflow:auto}
 #app{padding:34px 22px 48px;align-items:flex-start}
 .layout{grid-template-columns:1fr;gap:48px;max-width:520px}
 .cover-wrap{width:min(78vw,360px);margin:auto}
 .track-meta{padding-top:18px}
 .right{height:440px}
 #lyrics{top:38%}
 .lyric-line{font-size:clamp(25px,6vw,34px);margin-bottom:21px}
 #disconnect{top:12px;right:12px}
}
</style>
</head>
<body>
<div id="ambient"></div><div id="shade"></div>
<button id="disconnect" type="button">Disconnect</button>
<main>
<section id="connect">
<div class="connect-card">
<div class="wordmark">Afterglow</div>
<h1>Stay in the moment.</h1>
<p>Connect Spotify to see what’s playing, with lyrics moving alongside the music.</p>
<button class="primary" id="connectButton" type="button">Connect Spotify</button>
<div id="connectError" role="status"></div>
</div>
</section>
<section id="app">
<div class="layout">
<div class="left">
<div class="cover-wrap"><img id="cover" alt="Album artwork" src=""></div>
<div class="track-meta">
<div class="track-copy"><div class="track-title" id="title">Waiting for music</div><div class="artist" id="artist">Spotify</div><div class="album" id="album"></div></div>
<div class="status" id="playStatus">Now playing</div>
</div>
<div class="progress-area">
<div class="progress"><div class="progress-fill" id="progressFill"></div></div>
<div class="times"><span id="elapsed">0:00</span><span id="remaining">−0:00</span></div>
</div>
<div class="controls">
<button class="control" id="previous" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="control main-control" id="toggle" aria-label="Play or pause"><svg id="toggleIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<button class="control" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
</div>
<div class="right">
<div class="lyrics-head"><div class="lyrics-label">Live lyrics</div><div class="lyrics-state" id="lyricSource">Waiting for track</div></div>
<div class="lyrics-window"><div id="lyrics"><div class="empty">Your next song, in a new light.</div></div></div>
</div>
</div>
</section>
</main>
<script>
const CLIENT_ID='c361237077b7462180c155eafff8aeda';
const REDIRECT_URI=location.origin+location.pathname;
const SCOPES='user-read-currently-playing user-read-playback-state user-modify-playback-state';
const $=id=>document.getElementById(id);
let token='',refreshToken='',currentId='',trackDuration=0,position=0,isPlaying=false,lyricRows=[],lyricMode='none',poller=null,animator=null,lastPoll=0;
const enc=btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function randomString(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>('0'+x.toString(16)).slice(-2)).join('')}
async function challenge(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function connect(){const verifier=randomString();sessionStorage.setItem('pkce_verifier',verifier);const state=randomString(16);sessionStorage.setItem('oauth_state',state);const url=new URL('https://accounts.spotify.com/authorize');url.search=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:SCOPES,state,code_challenge_method:'S256',code_challenge:await challenge(verifier)});location.href=url}
async function tokenRequest(body){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});const data=await r.json();if(!r.ok)throw Error(data.error_description||data.error||'Spotify authorization failed');return data}
async function finishAuth(){const params=new URLSearchParams(location.search);const code=params.get('code');if(!code)return false;if(params.get('state')!==sessionStorage.getItem('oauth_state'))throw Error('Spotify sign-in could not be verified. Please try again.');const verifier=sessionStorage.getItem('pkce_verifier');const data=await tokenRequest({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:verifier});setTokens(data);history.replaceState({},'',REDIRECT_URI);return true}
function setTokens(data){token=data.access_token;if(data.refresh_token){refreshToken=data.refresh_token;localStorage.setItem('afterglow_refresh',refreshToken)}localStorage.setItem('afterglow_token',token);localStorage.setItem('afterglow_expiry',String(Date.now()+data.expires_in*1000))}
async function refresh(){refreshToken=refreshToken||localStorage.getItem('afterglow_refresh');if(!refreshToken)throw Error('Please reconnect Spotify.');const d=await tokenRequest({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:refreshToken});setTokens(d);return token}
async function api(path,method='GET'){if(!token||Date.now()>Number(localStorage.getItem('afterglow_expiry')||0)-60000)await refresh();let r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+token}});if(r.status===401){await refresh();r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+token}})}if(!r.ok&&r.status!==204)throw Error('Spotify request failed ('+r.status+')');return r.status===204?null:r.json()}
function showApp(){ $('connect').style.display='none';$('app').style.display='flex';$('disconnect').style.display='block';if(poller)clearInterval(poller);poll();poller=setInterval(poll,1800);if(animator)clearInterval(animator);animator=setInterval(renderProgress,200)}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function poll(){try{const data=await api('/me/player/currently-playing');if(!data||!data.item){$('playStatus').textContent='Nothing playing';return}const t=data.item;position=data.progress_ms||0;trackDuration=t.duration_ms||0;isPlaying=!!data.is_playing;lastPoll=Date.now();$('title').textContent=t.name;$('artist').textContent=t.artists.map(a=>a.name).join(', ');$('album').textContent=t.album.name;$('cover').src=t.album.images?.[0]?.url||'';$('playStatus').textContent=isPlaying?'Now playing':'Paused';setToggle();renderProgress();if(t.id!==currentId){currentId=t.id;loadLyrics(t)} }catch(e){$('playStatus').textContent='Reconnect needed'}}
function setToggle(){$('toggleIcon').innerHTML=isPlaying?'<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>'}
function renderProgress(){if(!trackDuration)return;const p=Math.min(trackDuration,position+(isPlaying?Date.now()-lastPoll:0));$('progressFill').style.width=(p/trackDuration*100)+'%';$('elapsed').textContent=fmt(p/1000);$('remaining').textContent='−'+fmt((trackDuration-p)/1000);renderLyrics(p)}
function parseLrc(s){const rows=[];for(const line of (s||'').split(/\r?\n/)){const m=[...line.matchAll(/\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/g)];const text=line.replace(/\[[^\]]+\]/g,'').trim();if(!text)continue;for(const x of m){const sec=Number(x[1])*60+Number(x[2])+Number(('0.'+(x[3]||'0')).replace('..','.'));rows.push({time:sec*1000,text})}}return rows.sort((a,b)=>a.time-b.time)}
async function loadLyrics(t){$('lyricSource').textContent='Finding lyrics';$('lyrics').innerHTML='<div class="empty">Finding the words…</div>';lyricRows=[];lyricMode='none';try{const u=new URL('https://lrclib.net/api/get');u.search=new URLSearchParams({track_name:t.name,artist_name:t.artists.map(a=>a.name).join(', '),album_name:t.album.name,duration:String(Math.round(t.duration_ms/1000))});const r=await fetch(u);if(!r.ok)throw Error('No matched lyrics');const data=await r.json();if(data.syncedLyrics){lyricRows=parseLrc(data.syncedLyrics);lyricMode='line';$('lyricSource').textContent='Line-synced lyrics'}else if(data.plainLyrics){lyricRows=data.plainLyrics.split(/\r?\n/).filter(Boolean).map((text,i)=>({time:null,text}));lyricMode='plain';$('lyricSource').textContent='Unsynced lyrics'}else throw Error('No lyrics available');drawLyrics()}catch(e){$('lyricSource').textContent='Lyrics unavailable';$('lyrics').innerHTML='<div class="empty">The words for this track aren’t available yet.</div>'}}
function drawLyrics(){const root=$('lyrics');root.innerHTML='';lyricRows.forEach((row,i)=>{const p=document.createElement('p');p.className='lyric-line';p.dataset.index=i;const words=row.text.split(/(\s+)/);words.forEach(w=>{if(!w.trim()){p.append(document.createTextNode(w));return}const span=document.createElement('span');span.className='word';span.textContent=w;p.append(span)});root.append(p)});renderLyrics(position)}
function renderLyrics(ms){if(!lyricRows.length)return;let active=0;if(lyricMode==='line'){for(let i=0;i<lyricRows.length;i++){if(lyricRows[i].time<=ms)active=i;else break}}else if(lyricMode==='plain'){active=Math.min(lyricRows.length-1,Math.floor(ms/Math.max(1,trackDuration)*lyricRows.length))}const els=[...$('lyrics').children];els.forEach((el,i)=>{el.classList.toggle('active',i===active);el.classList.toggle('past',i<active);if(i===active&&lyricMode==='line'){const next=lyricRows[i+1]?.time??trackDuration;const start=lyricRows[i].time;const ratio=Math.max(0,Math.min(.98,(ms-start)/Math.max(1,next-start)));const words=[...el.querySelectorAll('.word')];const count=Math.floor(ratio*words.length);words.forEach((w,j)=>{w.classList.toggle('sung',j<=count);w.classList.toggle('unsung',j>count)})}else el.querySelectorAll('.word').forEach(w=>w.classList.remove('sung','unsung'))});const activeEl=els[active];if(activeEl){const box=$('lyrics').parentElement.getBoundingClientRect();const y=activeEl.offsetTop;const target=box.height*.43;const offset=Math.max(0,y-target);$('lyrics').style.transform='translateY(-'+offset+'px)'}}
async function control(path){try{await api(path,'PUT');setTimeout(poll,350)}catch(e){$('playStatus').textContent='Control unavailable'}}
$('connectButton').addEventListener('click',()=>connect().catch(e=>$('connectError').textContent=e.message));
$('toggle').addEventListener('click',()=>control(isPlaying?'/me/player/pause':'/me/player/play'));
$('previous').addEventListener('click',()=>control('/me/player/previous'));
$('next').addEventListener('click',()=>control('/me/player/next'));
$('disconnect').addEventListener('click',()=>{localStorage.removeItem('afterglow_token');localStorage.removeItem('afterglow_refresh');localStorage.removeItem('afterglow_expiry');token='';refreshToken='';clearInterval(poller);clearInterval(animator);$('app').style.display='none';$('connect').style.display='grid';$('disconnect').style.display='none'});
async function init(){try{if(await finishAuth()){showApp();return}token=localStorage.getItem('afterglow_token')||'';refreshToken=localStorage.getItem('afterglow_refresh')||'';if(token||refreshToken){await refresh();showApp()}}catch(e){$('connectError').textContent=e.message}}
init();
</script>
</body>
</html>
