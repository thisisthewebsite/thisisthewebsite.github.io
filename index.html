<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000">
<title>♪</title>
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#1b2a4a}
@property --c2{syntax:'<color>';inherits:true;initial-value:#3a1f4d}
@property --c3{syntax:'<color>';inherits:true;initial-value:#0f3c52}
:root{--c1:#1b2a4a;--c2:#3a1f4d;--c3:#0f3c52;transition:--c1 1.2s ease,--c2 1.2s ease,--c3 1.2s ease}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{all:unset;cursor:pointer;display:grid;place-items:center;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .25s}
button:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:4px;border-radius:50%}

/* background */
.bg{position:fixed;inset:0;background:#07080c;overflow:hidden;contain:strict;transition:background 1s}
.bg i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform;transition:opacity 1.2s}
.bg i:nth-child(1){background:radial-gradient(closest-side,var(--c1),transparent);left:-24vmax;top:-28vmax;animation:m1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(closest-side,var(--c2),transparent);right:-28vmax;top:0;animation:m2 33s ease-in-out infinite alternate}
.bg i:nth-child(3){background:radial-gradient(closest-side,var(--c3),transparent);left:4vmax;bottom:-38vmax;animation:m3 39s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.5))}
.boot .bg,.login .bg{background:#000}
.boot .bg i,.login .bg i{opacity:0}
.paused .bg i,.idle .bg i{animation-play-state:paused}
@keyframes m1{to{transform:translate(22vmax,14vmax) scale(1.2)}}
@keyframes m2{to{transform:translate(-24vmax,10vmax) scale(.85)}}
@keyframes m3{to{transform:translate(18vmax,-18vmax) scale(1.15)}}

/* login */
#login{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .8s}
body:not(.login) #login{opacity:0;pointer-events:none}
#lb{display:flex;align-items:center;gap:10px;padding:16px 30px;border-radius:99px;background:#fff;color:#000;font-size:16px;font-weight:600;letter-spacing:-.01em;transition:transform .45s cubic-bezier(.2,1.3,.3,1),box-shadow .4s,opacity .4s}
#lb:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(255,255,255,.22)}
#lb:active{transform:scale(.95)}
#lb.busy{opacity:.5;pointer-events:none;transform:scale(.96)}
.login #lb{animation:sw 1.2s cubic-bezier(.2,.9,.2,1) .1s backwards}
#lb svg{width:22px;height:22px}

/* idle */
#idle{position:fixed;inset:0;display:grid;place-content:center;gap:8px;text-align:center;opacity:0;pointer-events:none;transition:opacity .9s}
#idle b{font-size:26px;font-weight:700;letter-spacing:-.02em}
#idle span{font-size:16px;color:rgba(255,255,255,.55);font-weight:500}
.idle.p1 #idle{opacity:1}

/* app */
#app{position:fixed;inset:0;overflow:hidden;transition:opacity 1s,transform 1.3s cubic-bezier(.2,.9,.2,1)}
#pgr{display:flex;width:300%;height:100%;transform:translate3d(calc(var(--pg,1)*-33.3333%),0,0);transition:transform .85s cubic-bezier(.77,0,.18,1)}
.pg{width:33.3333%;height:100%;flex:none;position:relative;visibility:hidden;transition:visibility 0s linear .85s}
.pg.on{visibility:visible;transition-delay:0s}
.main{display:grid;grid-template-columns:minmax(340px,42%) 1fr}
.boot #app,.login #app{opacity:0;transform:scale(.97);pointer-events:none}
.main>*{transition:opacity .6s}
.idle .main>*{opacity:0}
.left{display:grid;place-items:center;padding:max(4vh,env(safe-area-inset-top)) 2vw max(4vh,env(safe-area-inset-bottom)) 5vw}
.pl{width:clamp(220px,min(100%,100dvh - 330px),460px)}
.art{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.07);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);transition:transform 1s cubic-bezier(.2,.9,.2,1),box-shadow 1s}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art img.in{animation:artin 1s cubic-bezier(.2,.9,.2,1) backwards}
.paused .art{transform:scale(.86);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.meta{margin:28px 0 20px}
.tt{font-size:clamp(18px,1.5vw,24px);font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:clamp(15px,1.2vw,19px);font-weight:500;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sw{animation:sw .8s cubic-bezier(.2,.9,.2,1) backwards}
.bar{position:relative;height:5px;cursor:pointer;touch-action:none;transition:height .3s cubic-bezier(.3,1.4,.5,1)}
.bar::before{content:"";position:absolute;inset:-12px 0}
.bar:hover,.bar.d{height:9px}
.bar u{position:absolute;inset:0;display:block;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{position:absolute;inset:0;display:block;background:#fff;transform-origin:left;transform:scaleX(0);will-change:transform}
.tm{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:center;align-items:center;gap:clamp(26px,3.4vw,52px);margin:12px 0 22px}
.ctl svg{width:34px;height:34px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.ctl button:hover{transform:scale(1.1)}
.ctl button:active{transform:scale(.85)}
.pp{position:relative;width:64px;height:64px}
.pp svg{position:absolute;width:46px;height:46px;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.pp .i2{opacity:0;transform:scale(.4) rotate(-40deg)}
.paused .pp .i1{opacity:0;transform:scale(.4) rotate(40deg)}
.paused .pp .i2{opacity:1;transform:none}
.vol{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.6)}
.vol svg{width:17px;height:17px;fill:currentColor;flex:none}
.vol .bar{flex:1}

/* lyrics */
.right{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 78%,transparent)}
#ly{position:absolute;left:0;right:0;top:0;padding:0 5vw 0 1vw;--off:0px;transition:opacity .3s}
#ly.x{opacity:0}
#ly.nt .l{transition:none}
.l{font-size:clamp(26px,3.3vw,52px);font-weight:700;line-height:1.16;letter-spacing:-.022em;padding:.3em 0;cursor:pointer;transform-origin:left center;
transform:translate3d(0,var(--off),0) scale(.9);opacity:var(--o,.3);filter:blur(var(--b,0px));
transition:transform 1s cubic-bezier(.2,.9,.15,1) var(--dl,0s),opacity .6s ease,filter .6s ease;animation:lin 1.1s cubic-bezier(.2,.9,.2,1) backwards}
.l.a{transform:translate3d(0,var(--off),0) scale(1)}
.l:hover{opacity:.85;filter:blur(0)}
.l.f{visibility:hidden;filter:none;transition:none}
.w{color:#fff}
.a .w{color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(90deg,#fff calc(var(--p,0)*112% - 12%),rgba(255,255,255,.36) calc(var(--p,0)*112%));-webkit-background-clip:text;background-clip:text}
.g{display:flex;gap:.3em;align-items:center;height:1.2em;padding:.5em 0}
.g b{width:.34em;height:.34em;border-radius:50%;background:#fff}
.g.a b{animation:dot 1.8s ease-in-out infinite}
.g.a b:nth-child(2){animation-delay:.25s}
.g.a b:nth-child(3){animation-delay:.5s}
.nl{position:absolute;top:40%;left:1vw;font-size:20px;font-weight:600;color:rgba(255,255,255,.4);animation:sw 1s backwards}
@keyframes lin{from{opacity:0;transform:translate3d(0,calc(var(--off,0px) + 56px),0) scale(.92);filter:blur(10px)}}
@keyframes sw{from{opacity:0;transform:translateY(10px);filter:blur(8px)}}
@keyframes artin{from{opacity:0;transform:scale(1.12);filter:blur(14px)}}
@keyframes dot{50%{transform:scale(1.5);opacity:.45}}

/* join */
.lg{display:grid;justify-items:center}
#jw{position:relative;width:240px;height:76px;margin-top:24px}
#jw>*{position:absolute;left:0;right:0;top:0;transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.2,1)}
.u{text-align:center;font-size:14px;font-weight:500;color:rgba(255,255,255,.55);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.3)}
.u:hover{color:#fff}
#jc{opacity:0;transform:translateY(10px);pointer-events:none;text-align:center}
#login.j #jc{opacity:1;transform:none;pointer-events:auto}
#login.j .u{opacity:0;transform:translateY(-10px);pointer-events:none}
#ji{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;font-size:30px;font-weight:600;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;padding:6px 0 10px;border-bottom:1.5px solid rgba(255,255,255,.35);caret-color:#fff;transition:border-color .3s;user-select:text;-webkit-user-select:text}
#ji:focus{border-color:#fff}
#ji::placeholder{color:rgba(255,255,255,.22)}
#je{display:block;margin-top:10px;font-size:13px;min-height:16px;color:rgba(255,255,255,.55)}
.sh{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* search + playlists */
.sc,.pc{height:100%;overflow-y:auto;scrollbar-width:none;padding:max(9vh,env(safe-area-inset-top)) 0 14vh}
.sc::-webkit-scrollbar,.pc::-webkit-scrollbar{display:none}
#q{all:unset;box-sizing:border-box;display:block;width:min(760px,86vw);margin:0 auto;font-size:clamp(22px,2.6vw,34px);font-weight:700;letter-spacing:-.02em;padding:18px 24px;border-radius:18px;background:rgba(255,255,255,.1);transition:background .3s,box-shadow .3s;user-select:text;-webkit-user-select:text}
#q:focus{background:rgba(255,255,255,.15);box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
#q::placeholder{color:rgba(255,255,255,.35)}
#res{width:min(760px,86vw);margin:0 auto}
.h{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:30px 0 10px}
.r{display:flex;align-items:center;gap:16px;width:100%;padding:8px 12px;border-radius:12px;text-align:left;transition:background .25s,transform .35s cubic-bezier(.3,1.4,.5,1);animation:sw .6s cubic-bezier(.2,.9,.2,1) backwards}
.r:hover{background:rgba(255,255,255,.09)}
.r:active{transform:scale(.985)}
.r img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.08);flex:none}
.r span{min-width:0;flex:1}
.r b,.r small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r b{font-size:16px;font-weight:600}
.r small{font-size:14px;color:rgba(255,255,255,.55);margin-top:2px}
.hint{text-align:center;margin-top:18vh;color:rgba(255,255,255,.35);font-size:18px;font-weight:600}
.pc h2,#pls{width:min(1200px,88vw);margin:0 auto}
.pc h2{margin-bottom:26px;font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.025em}
#pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:26px 22px}
.c{display:block;text-align:left;animation:sw .7s cubic-bezier(.2,.9,.2,1) backwards}
.c .i{display:block;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.c .i::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .3s}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c:hover .i{transform:scale(1.04)}
.c:hover .i::after{opacity:1}
.c:active .i{transform:scale(.97)}
.c b{margin-top:10px;font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* arrows, party code, toast (visible only while the cursor is moving) */
.ab{position:fixed;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:rgba(255,255,255,.1);opacity:0;transition:opacity .5s,transform .35s cubic-bezier(.3,1.5,.5,1),background .3s;z-index:5}
.ab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#nl{left:14px}#nr{right:14px}
.m .ab{opacity:.9}
.ab:hover{opacity:.95;background:rgba(255,255,255,.2);transform:scale(1.1)}
.p0 #nl,.p2 #nr,.boot .ab,.login .ab{opacity:0!important;pointer-events:none!important}
#room{display:none;position:fixed;right:20px;bottom:18px;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;letter-spacing:.2em;white-space:pre;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;z-index:5}
.host #room{display:grid}
.login #room{display:none}
.m #room,#room:hover{opacity:.9;transform:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);padding:11px 18px;border-radius:99px;background:rgba(30,30,34,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .35s,transform .5s cubic-bezier(.2,.9,.2,1);z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* unsynced lyrics (Genius-style plain text) */
.un{overflow-y:auto;scrollbar-width:none}
.un::-webkit-scrollbar{display:none}
.un #ly{position:relative;padding:22vh 5vw 30vh 1vw}
.un #ly::before{content:"These lyrics aren’t time-synced";display:block;margin-bottom:26px;font-size:14px;font-weight:600;color:rgba(255,255,255,.4)}
.un .l{transform:none;opacity:.92;filter:none;cursor:default;transition:none;animation:sw .6s backwards;font-size:clamp(22px,2.3vw,34px);font-weight:600;line-height:1.3;padding:.18em 0}
.un .l.sp{height:.9em;padding:0}

@media(max-width:800px){
.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.left{padding:max(16px,env(safe-area-inset-top)) 24px 0}
.pl{width:100%;max-width:420px}
.art{width:min(46vw,26dvh);margin:0 auto}
.meta{margin:16px 0 12px}
.ctl{margin:6px 0 10px}.pp{height:56px}
.vol{display:none}
.l{font-size:clamp(24px,7vw,34px)}
}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
</style>
</head>

</div>

</div></main>

<script>
const CID='c361237077b7462180c155eafff8aeda',
RURI=location.origin+location.pathname.replace(/index\.html$/,''),
SCOPE='user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative',
SV=2,
MIRRORS=['https://lyricsplus.prjktla.workers.dev','https://lyricsplus.binimum.org','https://lyricsplus.atomix.one','https://lyricsplus-seven.vercel.app','https://lyrics-plus-backend.vercel.app'],
LEAD=.1,$=id=>document.getElementById(id),B=document.body,ly=$('ly'),PF=$('pf'),TC=$('tc'),TR=$('tr'),VB=$('vb'),RT=$('rt');
let S=JSON.parse(localStorage.getItem('s')||'{}'),st=null,lines=null,els=[],act=-9,drag=null,hold=0,vhold=0,rp=0,lastEnd=0,lastS=-1,miss=0,artK='',raf=0,off=+localStorage.getItem('o')||0,guest=false,hc=null,pg=1,owd=30,room='',nxt=null;
const cache=new Map(),

/* ---------- auth (PKCE, no secret needed) ---------- */
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(48))),
  c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  localStorage.setItem('v',v);
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RURI,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}
async function tok(b){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...b})});
  if(!r.ok){if(r.status<500){S={};localStorage.removeItem('s');view('login')}throw 0}
  const j=await r.json();
  S={a:j.access_token,r:j.refresh_token||S.r,e:Date.now()+j.expires_in*1000-60000,v:SV};

const fresh=()=>Date.now()<S.e?0:(rp=rp||tok({grant_type:'refresh_token',refresh_token:S.r}).finally(()=>rp=0));
async function api(p,o={},n=0){
  if(guest)return rpc(p,o);

  const r=await fetch('https://api.spotify.com/v1'+p,{...o,headers:{Authorization:'Bearer '+S.a,...(o.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401&&!n){S.e=0;return api(p,o,1)}
  return r;

/* ---------- lyrics: LyricsPlus (Apple Music / Spotify / Musixmatch, word-synced) raced against LRCLIB ---------- */
const clean=t=>t.name.replace(/\s*[-–].*$/,'').replace(/\s*[\(\[].*?[\)\]]/g,'').trim()||t.name,
secs=t=>Math.round(t.duration_ms/1000);
function fin(o,word){
  o.sort((a,b)=>a.t-b.t);

ji.oninput=()=>{ji.value=ji.value.toUpperCase().replace(/[^A-Z0-9]/g,'');je.textContent='';if(ji.value.length===5)join(ji.value)};
function bad(m){je.textContent=m;ji.disabled=false;ji.value='';ji.classList.remove('sh');void ji.offsetWidth;ji.classList.add('sh');ji.focus()}
async function join(c){
  ji.disabled=true;je.textContent='Connecting…';
  try{await loadPeer()}catch(e){return bad('Can’t reach the party service')}
  const peer=new Peer(),to=setTimeout(()=>{peer.destroy();bad('No response')},10000);
  peer.on('error',e=>{clearTimeout(to);peer.destroy();bad(e.type==='peer-unavailable'?'Code not found':'Couldn’t connect')});
  peer.on('open',()=>{
    const d=peer.connect(ID(c),{reliable:true});
    d.on('open',()=>{
      clearTimeout(to);guest=true;hc=d;ji.disabled=false;ji.value='';je.textContent='';
      lg.classList.remove('j');view('boot');
      const ping=()=>d.open?d.send({k:'p',t:performance.now()}):clearInterval(pi),pi=setInterval(ping,4000);ping();
    });
    d.on('data',onHost);
    d.on('close',()=>{guest=false;hc=null;st=null;lines=null;view('login');lg.classList.add('j');document.title='♪';bad('Party ended')});
  });
}
go(1);
