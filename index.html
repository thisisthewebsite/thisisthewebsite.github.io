<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Lyrics</title>
<style>
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --f{syntax:'<color>';inherits:false;initial-value:rgba(255,255,255,.34)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#bgw{position:fixed;inset:0;z-index:0;isolation:isolate;background:#000}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background:radial-gradient(90% 85% at 60% 18%,var(--c1) 0%,var(--c2) 58%,#000 100%)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,transparent 35%,rgba(0,0,0,.65) 100%)}
.bg.on{opacity:1}
#c{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
#cb{border:0;border-radius:999px;background:#fff;color:#000;font:700 17px/1 inherit;font-family:inherit;padding:17px 36px;cursor:pointer;animation:fade .8s cubic-bezier(.22,1,.36,1) backwards;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
#cb:hover{transform:scale(1.045);box-shadow:0 10px 40px rgba(255,255,255,.18)}
#cb:active{transform:scale(.97)}
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,9fr);grid-template-rows:minmax(0,1fr);column-gap:clamp(32px,5vw,88px);padding:0 clamp(24px,8vw,128px)}
.side{align-self:center;justify-self:start;width:min(100%,46vh);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,22px)}
.art{width:100%;aspect-ratio:1;border-radius:clamp(8px,1vw,14px);overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 24px 70px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);transform:scale(1);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.paused .art{transform:scale(.9)}
.art.sw{animation:pop .8s cubic-bezier(.22,1,.36,1)}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.meta{width:100%;min-width:0;text-align:center}
.meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:clamp(13px,1.15vw,16px);line-height:1.4}
#ta{color:rgba(255,255,255,.5)}
.meta.sw div{animation:fade .6s cubic-bezier(.22,1,.36,1) backwards}
.meta.sw #ta{animation-delay:.07s}
@keyframes pop{from{opacity:0;scale:.92}}
@keyframes fade{from{opacity:0;translate:0 8px}}
@keyframes rise{from{opacity:0;translate:0 34px}}
.lyr{position:relative;height:100%;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 78%,transparent 100%)}
.track{position:absolute;left:0;right:0;top:0;will-change:transform;transition:transform .75s cubic-bezier(.22,1,.36,1)}
.track.nt{transition:none}
.track.in .l{animation:rise .9s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
.track.quiet .l{animation:none}
.l{padding:.5em 6% .5em 0;font-size:clamp(24px,3.1vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.28;transform:scale(.94);transform-origin:left center;filter:blur(var(--b,0px));opacity:var(--o,1);transition:transform .6s cubic-bezier(.22,1,.36,1),filter .6s ease,opacity .6s ease;overflow-wrap:anywhere}
.l.on{transform:scale(1)}
.l span{--f:rgba(255,255,255,.34);background:linear-gradient(90deg,var(--f) calc(var(--p) - 10%),rgba(255,255,255,.34) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;transition:--f .7s ease}
.l.on span{--f:#fff;transition:none}
.track.nt .l,.track.nt .l span{transition:none}
.l.d span{letter-spacing:.14em}
.l.m{transform:none;filter:none;opacity:1;font-size:clamp(20px,2.4vw,34px)}
.l.m span{background:none;-webkit-text-fill-color:currentColor;color:rgba(255,255,255,.4)}
.lyr.plain{overflow-y:auto;scrollbar-width:none;user-select:text;-webkit-user-select:text}
.lyr.plain::-webkit-scrollbar{display:none}
.lyr.plain .track{position:relative;transform:none!important;will-change:auto;padding:14vh 0 26vh}
.lyr.plain .l{font-size:clamp(17px,1.9vw,28px);font-weight:600;transform:none;filter:none;opacity:1;padding:.2em 0}
.lyr.plain .l span{background:none;-webkit-text-fill-color:currentColor;color:rgba(255,255,255,.9)}
.lyr.plain .l.g{height:1.1em;padding:0}
#adj{position:fixed;right:clamp(14px,2vw,28px);bottom:clamp(14px,2.4vh,28px);z-index:5;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;visibility:hidden;transform:translateY(8px);pointer-events:none;transition:opacity .35s ease,transform .35s cubic-bezier(.22,1,.36,1),visibility .35s}
.ui #adj{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#adj button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#fff;font-family:inherit;font-size:18px;line-height:1;cursor:pointer;transition:background .2s}
#adj button:hover{background:rgba(255,255,255,.16)}
#ov{min-width:68px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}
#sr{padding:0 8px 0 12px;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.5)}
#sr:empty{display:none}
@media (max-aspect-ratio:1/1),(max-width:760px){
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:0;padding:max(18px,env(safe-area-inset-top)) 22px 0}
.side{flex-direction:row;width:100%;justify-self:stretch;align-self:start;gap:14px}
.art{width:clamp(64px,20vw,92px);flex:none}
.meta{flex:1;text-align:left}
.meta div{font-size:15px}
.lyr{height:100%}
.l{font-size:clamp(24px,7.2vw,36px)}
.lyr.plain .l{font-size:clamp(17px,4.6vw,24px)}
}
</style>
</head>
<body>
<div id="bgw"><div class="bg" id="b0"></div><div class="bg" id="b1"></div></div>
<div id="c" hidden><button id="cb">Connect to Spotify</button></div>
<main id="app" hidden>
<section class="side"><div class="art"><img alt="" draggable="false"></div><div class="meta"><div id="tt"></div><div id="ta"></div></div></section>
<section class="lyr"><div class="track in"></div></section>
<div id="adj"><span id="sr"></span><button id="m" aria-label="Earlier">−</button><span id="ov">0 ms</span><button id="p" aria-label="Later">+</button></div>
</main>
<script>
const CID='c361237077b7462180c155eafff8aeda';
const RURI=location.origin+location.pathname;
const SCOPE='user-read-playback-state user-read-currently-playing';
const API='https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode';
const LB='https://lrclib.net/api/';
const LM='https://api.lrcmux.dev/get?';
const LP=['https://lyricsplus.prjktla.my.id','https://lyricsplus.binimum.org','https://lyricsplus.atomix.one','https://lyricsplus.prjktla.workers.dev'];
const LO='https://api.lyrics.ovh/v1/';
const LS=localStorage;
const $=s=>document.querySelector(s);
const cEl=$('#c'),app=$('#app'),lyr=$('.lyr'),track=$('.track'),art=$('.art'),img=$('.art img'),meta=$('.meta'),tt=$('#tt'),ta=$('#ta'),ov=$('#ov'),sr=$('#sr'),bgs=[$('#b0'),$('#b1')];
let tok=null;
try{tok=JSON.parse(LS.getItem('sp_t'))}catch(e){}
let off=parseInt(LS.getItem('sp_o'),10)||0;
let tm=0,raf=0,raf2=0,ut=0,busy=false,base=0,bt=0,playing=false,dur=0,cur=null,ctl=null,L=null,idx=-2,fv=-1,anchor=0,bi=0,bz=0,wantArt='';
const cache=new Map();
const BL=[0,1.4,2.8,4.2,5.6,7],OP=[1,.95,.85,.75,.6,.5];
const cv=document.createElement('canvas');
cv.width=cv.height=16;
const cx=cv.getContext('2d',{willReadFrequently:true});
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fmt=()=>(off>0?'+':'')+off+' ms';
const curPos=()=>playing?base+(performance.now()-bt):base;
const pos=()=>curPos()+off;

async function login(){
const v=b64(crypto.getRandomValues(new Uint8Array(48)));
LS.setItem('sp_v',v);
const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RURI,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}

async function tokenReq(p){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...p})});
if(!r.ok)throw r.status;
const j=await r.json();
tok={a:j.access_token,r:j.refresh_token||(tok&&tok.r),e:Date.now()+j.expires_in*1000-30000};
LS.setItem('sp_t',JSON.stringify(tok));
}

function logout(){
LS.removeItem('sp_t');
tok=null;cur=null;playing=false;
clearTimeout(tm);
app.hidden=true;cEl.hidden=false;
}

async function boot(){
const q=new URLSearchParams(location.search);
if(q.get('code')){
history.replaceState(null,'',RURI);
try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:RURI,code_verifier:LS.getItem('sp_v')})}catch(e){}
}else if(q.get('error'))history.replaceState(null,'',RURI);
if(tok&&tok.r){cEl.hidden=true;app.hidden=false;ov.textContent=fmt();poll()}
else cEl.hidden=false;
}

async function poll(){
if(busy||!tok)return;
busy=true;
clearTimeout(tm);
let d=1000;
try{
if(Date.now()>tok.e)await tokenReq({grant_type:'refresh_token',refresh_token:tok.r});
const t0=performance.now();
const r=await fetch(API,{headers:{Authorization:'Bearer '+tok.a},cache:'no-store'});
const t1=performance.now();
if(r.status===200){apply(await r.json(),t0,t1);d=playing?Math.max(400,Math.min(1000,dur-curPos()+250)):1000}
else if(r.status===204)freeze();
else if(r.status===401){tok.e=0;d=0}
else if(r.status===429)d=(parseInt(r.headers.get('Retry-After'),10)||5)*1000;
else d=2000;
}catch(e){
if(e===400||e===401){busy=false;logout();return}
d=2000;
}
busy=false;
tm=setTimeout(poll,d);
}

function freeze(){
if(!playing)return;
base=curPos();bt=performance.now();playing=false;
app.classList.add('paused');
kick();
}

function apply(j,t0,t1){
const it=j.item;
if(!it){freeze();return}
const was=playing;
playing=!!j.is_playing;
const est=j.progress_ms+(t1-t0)/2;
const id=it.uri||it.id;
dur=it.duration_ms;
if(id!==cur){cur=id;base=est;bt=t1;load(it)}
else if(!playing){base=j.progress_ms;bt=t1}
else if(!was){base=est;bt=t1}
else{
const e=est-(base+(t1-bt));
if(Math.abs(e)>600){base=est;bt=t1}else base+=e*.25;
}
app.classList.toggle('paused',!playing);
kick();
}

function load(it){
if(ctl)ctl.abort();
const id=cur;
const names=it.artists?it.artists.map(a=>a.name):[it.show&&it.show.publisher||''];
tt.textContent=it.name;
ta.textContent=names.join(', ');
meta.classList.remove('sw');void meta.offsetWidth;meta.classList.add('sw');
const im=((it.album&&it.album.images)||it.images||[])[0];
setArt(im&&im.url);
L=null;idx=-2;
track.textContent='';
sr.textContent='';
lyr.classList.remove('plain');
if(it.type&&it.type!=='track')return;
const c=cache.get(id);
if(c!==undefined){show(c);return}
const t={name:it.name,artist:names[0]||'',album:it.album?it.album.name:'',dur:it.duration_ms,isrc:(it.external_ids&&it.external_ids.isrc)||''};
ctl=new AbortController();
const sg=ctl.signal;
getLyrics(t,sg,r=>{if(id===cur)show(r)}).then(o=>{
if(!o||id!==cur)return;
if(!o.best)show(null);
if(o.best||o.ok){
cache.set(id,o.best);
if(cache.size>60)cache.delete(cache.keys().next().value);
}
});
}

const clean=s=>{
const kw='(?:feat|ft|with|remaster(?:ed)?|version|mix|edit|live|mono|stereo|deluxe|bonus|radio|acoustic|demo|explicit|clean|from)';
let o=s.replace(new RegExp('\\s+[-–—]\\s+.*\\b(?:remaster(?:ed)?|version|mix|edit|live|mono|stereo|deluxe|bonus|radio|single|acoustic|demo|explicit)\\b.*$','i'),'');
o=o.replace(new RegExp('\\s*[\\(\\[][^\\)\\]]*\\b'+kw+'\\b[^\\)\\]]*[\\)\\]]','ig'),'');
return o.trim()||s;
};

function F(u,sg,ms,txt){
if(sg.aborted)return Promise.resolve();
const c=new AbortController();
const ab=()=>c.abort();
sg.addEventListener('abort',ab,{once:true});
const to=setTimeout(ab,ms);
return fetch(u,{signal:c.signal}).then(async r=>{
if(r.status===404||r.status===400||r.status===204)return null;
if(!r.ok)return;
return txt?await r.text():await r.json();
}).catch(()=>{}).finally(()=>{clearTimeout(to);sg.removeEventListener('abort',ab)});
}

function race(urls,sg,ms,txt){
return new Promise(res=>{
const ac=new AbortController();
const stop=()=>ac.abort();
sg.addEventListener('abort',stop,{once:true});
let i=0,f=0,done=false,w=0;
const fin=v=>{
if(done)return;
done=true;
clearTimeout(w);
sg.removeEventListener('abort',stop);
ac.abort();
res(v);
};
const next=()=>{
clearTimeout(w);
if(done)return;
if(sg.aborted)return fin();
if(i>=urls.length)return;
const u=urls[i++];
if(i<urls.length)w=setTimeout(next,900);
F(u,ac.signal,ms,txt).then(v=>{
if(done)return;
if(v!==undefined)return fin(v);
if(++f>=urls.length||sg.aborted)return fin();
next();
});
};
next();
});
}

function ts2(a,b){return +a*60000+Math.round(parseFloat(b.replace(':','.'))*1000)}

function mkw(it){
let s='';
const st=[],en=[];
for(const q of it){st.push(s.length);s+=q.s;en.push(s.trimEnd().length)}
const lead=s.length-s.trimStart().length;
const x=s.trim();
const n=x.length;
const w=it.map((q,i)=>{
const c=Math.min(n,Math.max(0,st[i]-lead));
return{t:q.t,e:q.e||0,c,n:Math.min(n,Math.max(c,en[i]-lead))};
});
return{x,w};
}

function lw(b,t0){
const re=/<(\d+):(\d+(?:[.:]\d+)?)>/g;
const mk=[];
let m;
while((m=re.exec(b)))mk.push({t:ts2(m[1],m[2]),a:m.index,z:re.lastIndex});
if(!mk.length)return null;
const it=[];
const head=b.slice(0,mk[0].a);
if(head.trim())it.push({t:t0,s:head});
for(let i=0;i<mk.length;i++)it.push({t:mk[i].t,s:b.slice(mk[i].z,i+1<mk.length?mk[i+1].a:b.length)});
let e=0;
const z=it[it.length-1];
if(it.length>1&&!z.s.trim()){e=z.t;it.pop()}
const r=mkw(it);
return r.x?{x:r.x,w:r.w,e}:null;
}

function parse(s){
const out=[];
for(const ln of s.split('\n')){
const re=/\[(\d+):(\d+(?:[.:]\d+)?)\]/g;
let m,last=0;
const ts=[];
while((m=re.exec(ln))){ts.push(ts2(m[1],m[2]));last=re.lastIndex}
if(!ts.length)continue;
const body=ln.slice(last);
const q=lw(body,ts[0]);
const x=q?q.x:body.replace(/<[^>]*>/g,'').trim();
for(const t of ts)out.push({t,x,e:q?q.e:0,w:q?q.w:null});
}
out.sort((a,b)=>a.t-b.t);
return out;
}

function mkSynced(txt,src,d){
const raw=parse(txt);
let n=0,wd=false;
for(const r of raw){if(r.x)n++;if(r.w)wd=true}
if(n<2)return null;
if(d&&raw[raw.length-1].t>d+4000)return null;
return{q:wd?3:2,raw,src:src+(wd?' · word':' · line')};
}

function plainOf(x){
const s=String(x).trim();
if(!s||s[0]==='{'||s[0]==='<')return '';
return s.replace(/^\[(?:ti|ar|al|au|by|offset|length|re|ve):.*$/gim,'').replace(/\r/g,'').trim();
}

function pick(list,d,src){
let bs=null,sd=1e12,bp='',pd=1e12,inst=false;
for(const x of list){
const df=Math.abs((x.duration||0)*1000-d);
if(x.instrumental){if(df<=3000)inst=true;continue}
if(x.syncedLyrics&&df<=3000&&df<sd){
const r=mkSynced(x.syncedLyrics,src,d);
if(r){bs=r;sd=df}
}
if(x.plainLyrics&&df<=20000&&df<pd){bp=x.plainLyrics;pd=df}
}
return{s:bs,p:bp,i:inst};
}

async function lyricsPlus(t,sg){
const q=new URLSearchParams({title:clean(t.name),artist:t.artist,duration:Math.round(t.dur/1000),source:'apple,lyricsplus,musixmatch,spotify,musixmatch-word'});
if(t.album)q.set('album',t.album);
if(t.isrc)q.set('isrc',t.isrc);
const d=await race(LP.map(h=>h+'/v2/lyrics/get?'+q),sg,6500,false);
if(!d)return d;
const a=d.lyrics;
if(!Array.isArray(a)||a.length<2)return null;
const raw=[];
let wd=false;
for(const l of a){
const t0=Math.round(+l.time||0);
const arr=l.syllabus||l.words||l.syllables;
const sy=Array.isArray(arr)?arr.filter(s=>s&&!s.isBackground&&typeof s.text==='string'):[];
let e=l.duration>0?t0+Math.round(l.duration):0;
if(sy.length){
let pv=t0;
const it=sy.map(s=>{
const st=Math.max(pv,Math.round(+s.time||0));
pv=st;
return{t:st,e:s.duration>0?st+Math.round(s.duration):0,s:s.text};
});
const r=mkw(it);
if(r.x){
if(!e)e=it[it.length-1].e;
raw.push({t:t0,x:r.x,e,w:r.w});
wd=true;
continue;
}
}
raw.push({t:t0,x:String(l.text||'').trim(),e,w:null});
}
raw.sort((x,y)=>x.t-y.t);
let n=0;
for(const r of raw)if(r.x)n++;
if(n<2)return null;
if(t.dur&&raw[raw.length-1].t>t.dur+4000)return null;
const nm=String((d.metadata&&d.metadata.source)||'lyricsplus').toLowerCase();
return{q:wd?3:2,raw,src:nm+(wd?' · word':' · line')};
}

async function lrcmux(t,sg){
const p={artist:t.artist,title:clean(t.name),format:'lrc'};
let x=await F(LM+new URLSearchParams({...p,level:'word'}),sg,7000,true);
if(x===null)x=await F(LM+new URLSearchParams(p),sg,7000,true);
if(!x)return x;
if(/\[\d+:\d+/.test(x))return mkSynced(x,'lrcmux',t.dur)||null;
const pl=plainOf(x);
return pl?{q:1,plain:pl,src:'lrcmux · plain'}:null;
}

async function lrclib(t,sg){
const sec=Math.round(t.dur/1000);
const g=await F(LB+'get?'+new URLSearchParams({track_name:t.name,artist_name:t.artist,album_name:t.album,duration:sec}),sg,6000);
let ok=g!==undefined,pl='',inst=false;
if(g){
if(g.syncedLyrics){const r=mkSynced(g.syncedLyrics,'lrclib',t.dur);if(r)return r}
if(g.instrumental)inst=true;
else if(g.plainLyrics)pl=g.plainLyrics;
}
if(sg.aborted)return;
const l=await F(LB+'search?'+new URLSearchParams({track_name:clean(t.name),artist_name:t.artist}),sg,6000);
if(l!==undefined)ok=true;
if(Array.isArray(l)){
const b=pick(l,t.dur,'lrclib');
if(b.s)return b.s;
if(!pl)pl=b.p;
if(b.i)inst=true;
}
if(!pl&&!inst&&!sg.aborted){
const q=await F(LB+'search?'+new URLSearchParams({q:t.name+' '+t.artist}),sg,6000);
if(q!==undefined)ok=true;
if(Array.isArray(q)){
const b=pick(q,t.dur,'lrclib');
if(b.s)return b.s;
pl=b.p;
if(b.i)inst=true;
}
}
if(pl)return{q:1,plain:pl,src:'lrclib · plain'};
if(inst)return{q:.5,inst:true,src:'lrclib'};
return ok?null:undefined;
}

async function ovh(t,sg){
const x=await F(LO+encodeURIComponent(t.artist)+'/'+encodeURIComponent(clean(t.name)),sg,6000);
if(x===undefined)return;
if(!x||!x.lyrics)return null;
const s=String(x.lyrics).replace(/\r/g,'').replace(/^Paroles de la chanson[^\n]*\n/i,'').trim();
return s?{q:1,plain:s,src:'lyrics.ovh · plain'}:null;
}

async function getLyrics(t,sg,push){
const ac=new AbortController();
const stop=()=>ac.abort();
sg.addEventListener('abort',stop,{once:true});
const s2=ac.signal;
let best=null,ok=false,shown=null,ft=0;
const flush=()=>{
clearTimeout(ft);
ft=0;
if(sg.aborted||!best||best===shown)return;
shown=best;
push(best);
};
const take=r=>{
if(r!==undefined)ok=true;
if(!r)return;
if(!best||r.q>best.q)best=r;
if(best.q>=2){flush();if(best.q===3)ac.abort()}
else if(best.q===1&&!ft)ft=setTimeout(flush,1500);
};
await Promise.all([lyricsPlus(t,s2),lrcmux(t,s2),lrclib(t,s2)].map(p=>p.then(take).catch(()=>{})));
if(!best&&!sg.aborted)await ovh(t,sg).then(take).catch(()=>{});
sg.removeEventListener('abort',stop);
if(sg.aborted)return;
flush();
return{best,ok};
}

function build(raw){
const res=[];
for(let k=0;k<raw.length;k++){
const c=raw[k],n=raw[k+1];
if(c.x){
const est=Math.min(8000,Math.max(2500,c.x.length*90));
let e=Math.max(c.e||(n&&n.t-c.t<=8000?n.t:c.t+est),c.t+1);
const o={t:c.t,e,x:c.x,d:false,w:null,len:c.x.length};
if(c.w&&c.w.length){
const w=c.w;
let pv=c.t;
for(let i=0;i<w.length;i++){
w[i].t=Math.max(w[i].t,pv);
pv=w[i].t;
}
e=Math.max(e,w[w.length-1].t+250);
o.e=e;
for(let i=0;i<w.length;i++){
const nx=i+1<w.length?w[i+1].t:e;
if(!w[i].e||w[i].e<w[i].t||w[i].e>nx)w[i].e=nx;
}
o.w=w;
}
res.push(o);
if(c.e&&n&&n.x&&n.t-c.e>=4000)res.push({t:c.e,e:n.t,x:'• • •',d:true,w:null,len:5});
}else if(n&&n.t-c.t>=4000){
res.push({t:c.t,e:n.t,x:'• • •',d:true,w:null,len:5});
}
}
return res;
}

function find(p){
const a=L.lines;
let lo=0,hi=a.length-1,r=-1;
while(lo<=hi){
const m=(lo+hi)>>1;
if(a[m].t<=p){r=m;lo=m+1}else hi=m-1;
}
return r;
}

function mk(x,cls){
const e=document.createElement('div');
e.className='l'+(cls?' '+cls:'');
if(x){const s=document.createElement('span');s.textContent=x;e.appendChild(s)}
return e;
}

function show(r){
const soft=!!(L&&L.sync);
track.classList.add('nt');
track.classList.toggle('quiet',soft);
track.textContent='';
L=null;idx=-2;fv=-1;
lyr.classList.remove('plain');
lyr.scrollTop=0;
sr.textContent=r&&r.src?r.src:'';
const f=document.createDocumentFragment();
let lines=null;
if(r&&r.raw){lines=build(r.raw);if(!lines.length)lines=null}
if(lines){
L={sync:true,lines,els:[],sp:[],tops:[]};
const i0=find(pos());
lines.forEach((l,k)=>{
const e=mk(l.x,l.d?'d':'');
e.style.setProperty('--i',Math.min(Math.abs(k-Math.max(i0,0)),12));
f.appendChild(e);
L.els.push(e);L.sp.push(e.firstChild);
});
track.appendChild(f);
measure();
setIdx(i0);
}else if(r&&r.plain){
L={sync:false};
lyr.classList.add('plain');
let gap=true;
r.plain.split('\n').forEach(x=>{
x=x.trim();
if(!x){if(!gap)f.appendChild(mk('','g'));gap=true;return}
gap=false;
f.appendChild(mk(x,''));
});
track.appendChild(f);
}else{
L={sync:false,msg:true};
track.appendChild(mk(r&&r.inst?'Instrumental':'No lyrics found','m'));
measure();
}
void track.offsetWidth;
track.classList.remove('nt');
kick();
}

function measure(){
if(!L)return;
anchor=lyr.clientHeight*.23;
if(L.sync){
const e=L.els;
for(let i=0;i<e.length;i++)L.tops[i]=e[i].offsetTop;
place();
}else if(L.msg)track.style.transform='translate3d(0,'+anchor+'px,0)';
}

function place(){
track.style.transform='translate3d(0,'+(anchor-L.tops[Math.max(idx,0)])+'px,0)';
}

function setIdx(i){
const a=L.els,s=L.sp;
for(let j=0;j<a.length;j++){
const d=j===i?0:Math.min(Math.abs(j-i),5);
const k=(j<i?'p':j>i?'f':'a')+d;
if(a[j]._k===k)continue;
a[j]._k=k;
a[j].style.setProperty('--b',BL[d]+'px');
a[j].style.setProperty('--o',OP[d]);
a[j].classList.toggle('on',j===i);
s[j].style.setProperty('--p',j<i?'110%':'0%');
}
idx=i;fv=-1;
place();
}

function prog(l,p){
const w=l.w;
if(!w){
const t=(p-l.t)/(l.e-l.t);
return t<0?0:t>1?1:t;
}
let k=-1;
for(let j=0;j<w.length;j++){
if(w[j].t<=p)k=j;else break;
}
if(k<0)return 0;
const a=w[k];
const d=a.e-a.t;
const f=d>0?Math.min(1,(p-a.t)/d):1;
return Math.min(1,(a.c+f*(a.n-a.c))/l.len);
}

function frame(){
raf=0;
if(!L||!L.sync)return;
const p=pos(),i=find(p);
if(i!==idx)setIdx(i);
if(i>=0){
const v=prog(L.lines[i],p)*110;
if(Math.abs(v-fv)>.15){fv=v;L.sp[i].style.setProperty('--p',v+'%')}
}
if(playing)raf=requestAnimationFrame(frame);
}

function kick(){if(!raf)raf=requestAnimationFrame(frame)}

function col(d){
let r=0,g=0,b=0,w=0;
for(let i=0;i<d.length;i+=4){
const R=d[i],G=d[i+1],B=d[i+2];
const k=Math.max(R,G,B)-Math.min(R,G,B)+8;
const q=k*k;
r+=R*q;g+=G*q;b+=B*q;w+=q;
}
r/=w;g/=w;b/=w;
const m=Math.max(r,g,b,1);
const fa=Math.min(95/m,4),fb=Math.min(20/m,1);
const rgb=f=>'rgb('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+')';
return{a:rgb(fa),b:rgb(fb)};
}

function bg(c){
const n=bgs[bi^1],o=bgs[bi];
clearTimeout(n._t);
n.style.transition='none';
n.classList.remove('on');
void n.offsetWidth;
n.style.transition='';
n.style.setProperty('--c1',c?c.a:'#1a1a1a');
n.style.setProperty('--c2',c?c.b:'#050505');
n.style.zIndex=++bz;
n.classList.add('on');
clearTimeout(o._t);
o._t=setTimeout(()=>o.classList.remove('on'),1400);
bi^=1;
}

function setArt(u){
wantArt=u||'';
if(!u){img.removeAttribute('src');bg(null);return}
const m=new Image();
m.crossOrigin='anonymous';
m.onload=()=>{
if(wantArt!==u)return;
img.src=u;
art.classList.remove('sw');void art.offsetWidth;art.classList.add('sw');
let c=null;
try{cx.clearRect(0,0,16,16);cx.drawImage(m,0,0,16,16);c=col(cx.getImageData(0,0,16,16).data)}catch(e){}
bg(c);
};
m.onerror=()=>{if(wantArt===u){img.src=u;bg(null)}};
m.src=u;
}

function adj(d){
off+=d;
LS.setItem('sp_o',off);
ov.textContent=fmt();
kick();
}

function ui(){
document.documentElement.classList.add('ui');
clearTimeout(ut);
ut=setTimeout(()=>document.documentElement.classList.remove('ui'),2400);
}

$('#cb').onclick=login;
$('#m').onclick=()=>adj(-50);
$('#p').onclick=()=>adj(50);
addEventListener('pointermove',ui,{passive:true});
addEventListener('pointerdown',ui,{passive:true});
addEventListener('keydown',e=>{
if(e.key==='ArrowLeft')adj(-50);
else if(e.key==='ArrowRight')adj(50);
else return;
ui();
});
document.addEventListener('visibilitychange',()=>{
if(!document.hidden&&tok){poll();kick()}
});
new ResizeObserver(()=>{
if(raf2)return;
raf2=requestAnimationFrame(()=>{raf2=0;measure()});
}).observe(lyr);
boot();
</script>
