<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>untitled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07070a;color:#fff;font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:3px}
#bg{position:fixed;inset:-14%;background:#15151d center/cover no-repeat;filter:blur(90px) saturate(1.8) brightness(.62);transform:translateZ(0)}
#veil{position:fixed;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.08),rgba(0,0,0,.55)),radial-gradient(120% 90% at 85% 15%,transparent,rgba(0,0,0,.4))}
#stage{position:relative;height:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(260px,400px) minmax(0,1fr);gap:clamp(32px,7vw,120px);padding:clamp(24px,5vw,72px);align-items:center}
#left{display:flex;flex-direction:column;gap:20px}
#cover{width:100%;aspect-ratio:1;border-radius:22px;background:linear-gradient(140deg,#262633,#13131a) center/cover no-repeat;box-shadow:0 34px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);cursor:pointer}
#meta{display:flex;flex-direction:column;gap:3px;min-width:0}
#title{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{font-size:15px;font-weight:500;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#fill{height:100%;width:0;background:#fff;border-radius:4px}
#times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);margin-top:-8px;font-variant-numeric:tabular-nums}
#controls{display:flex;align-items:center;justify-content:space-between}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.75);transition:background .2s,color .2s}
.ic:hover{background:rgba(255,255,255,.1);color:#fff}
#toggle{width:60px;height:60px;background:#fff;color:#0a0a0e}
#toggle:hover{background:#fff;color:#0a0a0e;transform:scale(1.04)}
#stats{display:flex;gap:18px;font-size:13px;font-weight:600;color:rgba(255,255,255,.5);min-height:18px;font-variant-numeric:tabular-nums}
#stats b{color:#fff;font-weight:700}
#right{position:relative;height:min(84vh,840px);display:flex;flex-direction:column;gap:14px;min-width:0}
#pill{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:15px;font-weight:700;letter-spacing:.01em;color:rgba(255,255,255,.65);backdrop-filter:blur(12px);transition:color .35s,background .35s,border-color .35s}
#pill small{font-size:13px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
#right.listen #pill{color:#ffc46b;background:rgba(255,196,107,.13);border-color:rgba(255,196,107,.4)}
#right.type #pill{color:#7dffb3;background:rgba(125,255,179,.12);border-color:rgba(125,255,179,.38)}
.eq{display:inline-flex;gap:3px;align-items:center;height:18px}
.eq b{display:block;width:3px;height:6px;border-radius:2px;background:currentColor}
#right.listen .eq b{animation:eq .9s ease-in-out infinite}
#right.listen .eq b:nth-child(2){animation-delay:.18s}
#right.listen .eq b:nth-child(3){animation-delay:.36s}
#right.listen .eq b:nth-child(4){animation-delay:.12s}
#right.type .eq b{height:10px}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
#view{position:relative;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 14%,#000 74%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 14%,#000 74%,transparent 100%)}
#lyrics{position:absolute;left:0;right:0;top:0;transition:transform .7s cubic-bezier(.22,.8,.2,1)}
.line{font-size:clamp(26px,3.3vw,46px);font-weight:800;line-height:1.16;letter-spacing:-.025em;padding:11px 0;color:rgba(255,255,255,.27);transition:opacity .5s,filter .5s}
.line.skipped{color:rgba(255,255,255,.2)}
.w{display:inline-block;white-space:nowrap}
.c{position:relative;transition:color .12s}
.c.on{color:#fff}
.line.skipped .c.on{color:rgba(255,255,255,.55)}
.c.cur::before{content:"";position:absolute;left:-1px;top:.1em;bottom:.1em;width:3px;border-radius:2px;background:#fff;animation:blink 1.05s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
#right.listen .line.cursor{opacity:.42!important}
#right.listen .c.cur::before{animation:none;opacity:.3}
#right.idle .c.cur::before{animation:none;opacity:.3}
#empty{position:absolute;left:0;top:30%;font-size:clamp(26px,3.3vw,46px);font-weight:800;letter-spacing:-.025em;color:rgba(255,255,255,.22);line-height:1.15;max-width:12em}
#panel{position:fixed;inset:0;display:none;justify-content:center;align-items:flex-start;padding-top:11vh;background:rgba(5,5,8,.6);backdrop-filter:blur(22px);z-index:20}
#panel.open{display:flex}
#box{width:min(580px,92vw)}
#q{width:100%;padding:19px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:19px;font-weight:600;outline:none}
#q::placeholder{color:rgba(255,255,255,.35)}
#q:focus{border-color:rgba(255,255,255,.4)}
#results{margin-top:12px;max-height:58vh;overflow:auto}
.res{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;width:100%;text-align:left}
.res.sel,.res:hover{background:rgba(255,255,255,.1)}
.res img{width:50px;height:50px;border-radius:9px;object-fit:cover;background:#222}
.res span{display:block;min-width:0}
.res .n{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .a{font-size:14px;font-weight:500;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#login{position:fixed;inset:0;z-index:30;background:#07070a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px}
#login.show{display:flex}
#login h1{font-size:clamp(48px,9vw,104px);font-weight:800;letter-spacing:-.05em;line-height:.95}
#login p{font-size:17px;font-weight:500;color:rgba(255,255,255,.55);max-width:26em;line-height:1.45}
#connect{padding:16px 34px;border-radius:99px;background:#fff;color:#0a0a0e;font-weight:700;font-size:16px;transition:transform .2s}
#connect:hover{transform:scale(1.04)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);opacity:0;pointer-events:none;padding:13px 20px;border-radius:14px;background:rgba(30,30,38,.92);border:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:600;transition:opacity .3s,transform .3s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
#stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:20px;padding:20px}
#left{display:grid;grid-template-columns:92px 1fr;grid-template-areas:"c m" "b b" "t t" "k k" "s s";gap:12px 16px;align-items:center}
#cover{grid-area:c;border-radius:14px}
#meta{grid-area:m}
#bar{grid-area:b}
#times{grid-area:t;margin-top:-6px}
#controls{grid-area:k}
#stats{grid-area:s}
#right{height:100%}
}
@media(prefers-reduced-motion:reduce){#lyrics{transition:none}.eq b{animation:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="veil"></div>
<main id="stage">
<section id="left">
<div id="cover" title="search"></div>
<div id="meta"><div id="title">nothing playing</div><div id="artist">search for a song to start</div></div>
<div id="bar"><div id="fill"></div></div>
<div id="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
<div id="controls">
<button class="ic" id="search" aria-label="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
<button class="ic" id="toggle" aria-label="play or pause"></button>
<button class="ic" id="restart" aria-label="restart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
</div>
<div id="stats"></div>
</section>
<section id="right" class="idle">
<div id="pill"><i class="eq"><b></b><b></b><b></b><b></b></i><span id="pillText">search a track</span><small id="pillSub"></small></div>
<div id="view"><div id="lyrics"></div></div>
</section>
</main>
<div id="panel"><div id="box"><input id="q" type="text" placeholder="search songs" autocomplete="off" spellcheck="false"><div id="results"></div></div></div>
<div id="login"><h1>untitled</h1><p>type the lyrics as the song plays. only the right letters land, so there are no mistakes, only timing. playback needs a Spotify Premium account.</p><button id="connect">Connect Spotify</button></div>
<div id="toast"></div>
<script>
const CLIENT_ID='c361237077b7462180c155eafff8aeda';
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const SCOPES='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
const SKIP=4;
const $=id=>document.getElementById(id);
const store={
get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const isTypable=ch=>/^[a-z0-9]$/.test(fold(ch));
const hasTyp=w=>[...w].some(isTypable);
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)};

async function login(){
const v=rand(48);
store.set('verifier',v);
const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
location.href='https://accounts.spotify.com/authorize?'+p;
}
async function tokenReq(body){
try{
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,...body})});
if(!r.ok)return false;
const j=await r.json();
store.set('at',j.access_token);
if(j.refresh_token)store.set('rt',j.refresh_token);
store.set('exp',String(Date.now()+j.expires_in*1000-30000));
return true;
}catch(e){return false}
}
async function getToken(){
if(store.get('at')&&Date.now()<Number(store.get('exp')))return store.get('at');
const rt=store.get('rt');
if(rt&&await tokenReq({grant_type:'refresh_token',refresh_token:rt}))return store.get('at');
return null;
}
async function api(path,opt={}){
const t=await getToken();
if(!t)return null;
try{
const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});
if(!r.ok)return null;
if(r.status===204)return {};
try{return await r.json()}catch(e){return {}}
}catch(e){return null}
}

let toastTimer;
function toast(m){
const t=$('toast');
t.textContent=m;
t.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}

let player,deviceId,waiters=[];
const whenReady=()=>deviceId?Promise.resolve(deviceId):new Promise(r=>waiters.push(r));
function loadPlayer(){
window.onSpotifyWebPlaybackSDKReady=()=>{
player=new Spotify.Player({name:'untitled',getOAuthToken:cb=>getToken().then(t=>cb(t)),volume:.8});
player.addListener('ready',({device_id})=>{deviceId=device_id;waiters.splice(0).forEach(f=>f(device_id))});
player.addListener('player_state_changed',onState);
player.addListener('account_error',()=>toast('Spotify Premium is required to play music here.'));
player.addListener('authentication_error',()=>toast('Session expired. Reload the page to reconnect.'));
player.addListener('initialization_error',()=>toast('This browser cannot play Spotify audio.'));
player.connect();
};
const s=document.createElement('script');
s.src='https://sdk.scdn.co/spotify-player.js';
document.body.appendChild(s);
}

let current=null,currentUri=null,pos=0,posAt=0,playing=false,dur=0;
let lines=[],parsed=[],cur=0,shown=-1,caretEl=null;
let loading=false,noLyrics=false,token=0;
let typed=0,total=0,hits=[],lastSec=-1,lastStats=0,curMode='',curTxt='',curSub='';

const now=()=>playing?pos+(performance.now()-posAt)/1000:pos;

const ICON_PLAY='<svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.4-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>';
const ICON_PAUSE='<svg width="24" height="24" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>';
function icon(){$('toggle').innerHTML=playing?ICON_PAUSE:ICON_PLAY}
icon();

function onState(s){
if(!s||!s.track_window||!s.track_window.current_track)return;
const t=s.track_window.current_track;
const ok=t.uri===currentUri||(t.linked_from&&t.linked_from.uri===currentUri);
if(!ok)return;
pos=s.position/1000;
posAt=performance.now();
playing=!s.paused;
dur=s.duration/1000;
icon();
}

function parseLrc(txt){
const out=[];
let depth=0;
for(const raw of txt.split('\n')){
const times=[...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)].map(m=>Number(m[1])*60+Number(m[2]));
if(!times.length)continue;
const body=raw.replace(/\[[^\]]*\]/g,'').replace(/<[^>]*>/g,'');
if(depth>0&&!body.includes(')'))depth=0;
let o='';
for(const ch of body){
if(ch==='('){depth++;continue}
if(ch===')'){depth=Math.max(0,depth-1);continue}
if(!depth)o+=ch;
}
const text=o.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\s+/g,' ').trim();
const words=text.split(' ').filter(hasTyp);
if(!words.length)continue;
times.forEach(t=>out.push({t,text:words.join(' ')}));
}
return out.sort((a,b)=>a.t-b.t);
}

async function fetchLyrics(t){
const base='https://lrclib.net/api/';
try{
const q=new URLSearchParams({track_name:t.name,artist_name:t.artist,album_name:t.album,duration:String(Math.round(t.duration))});
const r=await fetch(base+'get?'+q);
if(r.ok){const j=await r.json();if(j.syncedLyrics)return j.syncedLyrics}
}catch(e){}
try{
const clean=t.name.replace(/\s+-\s.*$/,'').replace(/\s*\([^)]*(feat|with|remaster|live|version|edit)[^)]*\)/gi,'').trim()||t.name;
const q=new URLSearchParams({track_name:clean,artist_name:t.artist});
const r=await fetch(base+'search?'+q);
if(r.ok){
const a=await r.json();
const m=a.filter(x=>x.syncedLyrics).sort((x,y)=>Math.abs(x.duration-t.duration)-Math.abs(y.duration-t.duration))[0];
if(m&&Math.abs(m.duration-t.duration)<10)return m.syncedLyrics;
}
}catch(e){}
return null;
}

function settle(L){
while(L.idx<L.chars.length&&!L.chars[L.idx].typable){
L.chars[L.idx].el.classList.add('on');
L.idx++;
}
if(L.idx>=L.chars.length)L.done=true;
}

function build(list){
const box=$('lyrics');
box.innerHTML='';
typed=0;
hits=[];
total=0;
cur=0;
shown=-1;
caretEl=null;
lines=list.map(p=>{
const el=document.createElement('div');
el.className='line';
const chars=[];
const words=p.text.split(' ');
words.forEach((w,wi)=>{
const ws=document.createElement('span');
ws.className='w';
for(const ch of w){
const c=document.createElement('span');
c.className='c';
c.textContent=ch;
ws.appendChild(c);
const typable=isTypable(ch);
if(typable)total++;
chars.push({el:c,ch,typable});
}
el.appendChild(ws);
if(wi<words.length-1){
const c=document.createElement('span');
c.className='c';
c.textContent=' ';
el.appendChild(c);
chars.push({el:c,ch:' ',typable:true});
total++;
}
});
box.appendChild(el);
const L={t:p.t,el,chars,idx:0,done:false,skipped:false};
settle(L);
return L;
});
}

function paint(){
lines.forEach((L,i)=>{
const d=i-cur;
const a=Math.abs(d);
L.el.classList.toggle('cursor',d===0);
L.el.classList.toggle('skipped',L.skipped);
L.el.style.opacity=d===0?1:Math.max(.1,(d<0?.5:.62)-(a-1)*.13);
L.el.style.filter=a<=1?'none':'blur('+Math.min(4,(a-1)*.9)+'px)';
});
}
function place(){
if(!lines.length)return;
const L=lines[Math.min(cur,lines.length-1)];
const h=$('view').clientHeight;
$('lyrics').style.transform='translateY('+(h*.34-L.el.offsetTop-L.el.offsetHeight/2)+'px)';
}
function caret(){
if(caretEl)caretEl.classList.remove('cur');
caretEl=null;
const L=lines[cur];
if(L&&!L.done){caretEl=L.chars[L.idx].el;caretEl.classList.add('cur')}
}

function sync(p){
while(cur<lines.length){
const L=lines[cur];
if(L.done){cur++;continue}
const n=lines[cur+1];
if(n&&p>n.t+SKIP){L.skipped=true;cur++;continue}
break;
}
const L=lines[cur];
return !!L&&playing&&p>=L.t-.1;
}

function setMode(ok,p){
let m='idle',txt='search a track',sub='';
if(current){
if(loading)txt='finding lyrics';
else if(noLyrics)txt='no synced lyrics for this track';
else if(lines.length){
if(cur>=lines.length)txt='finished';
else if(!playing)txt='paused';
else if(ok){m='type';txt='type now'}
else{m='listen';txt='listen';sub=Math.max(1,Math.ceil(lines[cur].t-p))+'s'}
}
}
if(m!==curMode){curMode=m;$('right').className=m;document.body.dataset.mode=m}
if(txt!==curTxt){curTxt=txt;$('pillText').textContent=txt}
if(sub!==curSub){curSub=sub;$('pillSub').textContent=sub}
}

function frame(){
const p=now();
const ok=lines.length?sync(p):false;
if(cur!==shown){shown=cur;paint();place();caret()}
$('fill').style.width=Math.min(100,dur?p/dur*100:0)+'%';
const sec=Math.floor(p);
if(sec!==lastSec){lastSec=sec;$('t1').textContent=fmt(p);$('t2').textContent=fmt(dur)}
setMode(ok,p);
const t=performance.now();
if(t-lastStats>500){
lastStats=t;
hits=hits.filter(x=>x>t-8000);
if(lines.length){
const wpm=Math.round(hits.length/5*7.5);
const pct=total?Math.round(typed/total*100):0;
$('stats').innerHTML='<span><b>'+wpm+'</b> wpm</span><span><b>'+pct+'</b>% typed</span>';
}else $('stats').innerHTML='';
}
requestAnimationFrame(frame);
}

document.addEventListener('keydown',e=>{
if($('panel').classList.contains('open')||e.target.tagName==='INPUT')return;
if(e.metaKey||e.ctrlKey||e.altKey||e.key.length!==1)return;
e.preventDefault();
if(!lines.length)return;
if(!sync(now()))return;
const L=lines[cur];
const c=L.chars[L.idx];
if(fold(e.key)!==fold(c.ch))return;
c.el.classList.add('on');
L.idx++;
typed++;
hits.push(performance.now());
settle(L);
if(L.done){sync(now());}
caret();
});
document.addEventListener('keyup',e=>{
if(e.key===' '&&!$('panel').classList.contains('open')&&e.target.tagName!=='INPUT')e.preventDefault();
});
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.blur()));
window.addEventListener('resize',place);

async function play(t){
if(player)player.activateElement();
const my=++token;
current=t;
currentUri=t.uri;
playing=false;
pos=0;
posAt=performance.now();
dur=t.duration;
lines=[];
parsed=[];
$('lyrics').innerHTML='';
$('lyrics').style.transform='translateY(0)';
loading=true;
noLyrics=false;
$('title').textContent=t.name;
$('artist').textContent=t.artists;
$('cover').style.backgroundImage=t.cover?'url("'+t.cover+'")':'';
$('bg').style.backgroundImage=t.cover?'url("'+t.cover+'")':'';
document.title=t.name+' - untitled';
icon();
const lp=fetchLyrics(t);
const dev=await whenReady();
const res=await api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify({uris:[t.uri],position_ms:0})});
if(!res&&my===token)toast('Could not start playback. A Spotify Premium account is required.');
const txt=await lp;
if(my!==token)return;
loading=false;
if(!txt){noLyrics=true;return}
parsed=parseLrc(txt);
if(!parsed.length){noLyrics=true;return}
build(parsed);
}

const toTrack=x=>({
uri:x.uri,
name:x.name,
artist:x.artists[0].name,
artists:x.artists.map(a=>a.name).join(', '),
album:x.album.name,
cover:(x.album.images[0]||{}).url,
thumb:(x.album.images[2]||x.album.images[0]||{}).url,
duration:x.duration_ms/1000
});

let items=[],sel=0,searchTimer;
function openPanel(){
$('panel').classList.add('open');
$('q').focus();
$('q').select();
}
function closePanel(){
$('panel').classList.remove('open');
$('q').blur();
}
function renderResults(){
const box=$('results');
box.innerHTML='';
items.forEach((t,i)=>{
const b=document.createElement('button');
b.className='res'+(i===sel?' sel':'');
const img=document.createElement('img');
if(t.thumb)img.src=t.thumb;
img.alt='';
const s=document.createElement('span');
const n=document.createElement('span');
n.className='n';
n.textContent=t.name;
const a=document.createElement('span');
a.className='a';
a.textContent=t.artists;
s.appendChild(n);
s.appendChild(a);
b.appendChild(img);
b.appendChild(s);
b.addEventListener('click',()=>choose(t));
box.appendChild(b);
});
}
function choose(t){
closePanel();
play(t);
}
async function search(){
const q=$('q').value.trim();
if(!q){items=[];renderResults();return}
const j=await api('/search?type=track&limit=12&q='+encodeURIComponent(q));
if(!j||!j.tracks||$('q').value.trim()!==q)return;
items=j.tracks.items.map(toTrack);
sel=0;
renderResults();
}
$('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,260)});
$('q').addEventListener('keydown',e=>{
if(e.key==='Escape'){closePanel();return}
if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);renderResults()}
if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);renderResults()}
if(e.key==='Enter'&&items[sel])choose(items[sel]);
});
$('panel').addEventListener('mousedown',e=>{if(e.target===$('panel'))closePanel()});
$('search').addEventListener('click',openPanel);
$('cover').addEventListener('click',openPanel);
$('toggle').addEventListener('click',()=>{if(player&&current)player.togglePlay()});
$('restart').addEventListener('click',()=>{
if(!player||!current||!parsed.length)return;
build(parsed);
pos=0;
posAt=performance.now();
player.seek(0).then(()=>player.resume());
});
$('connect').addEventListener('click',login);

(async()=>{
requestAnimationFrame(frame);
const sp=new URLSearchParams(location.search);
const code=sp.get('code');
if(code){
await tokenReq({grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:store.get('verifier')||''});
history.replaceState({},'',REDIRECT);
}else if(sp.get('error')){
history.replaceState({},'',REDIRECT);
}
const t=await getToken();
if(!t){$('login').classList.add('show');return}
loadPlayer();
setInterval(()=>{if(player&&current)player.getCurrentState().then(onState)},1000);
openPanel();
})();
</script>
