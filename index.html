<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synchrony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:-30%;background:center/cover no-repeat;filter:blur(70px) saturate(1.8) brightness(.62);opacity:0;transition:opacity 1.4s ease;animation:dr 50s ease-in-out infinite alternate;will-change:transform}
.bg.on{opacity:1}
@keyframes dr{to{transform:scale(1.25) rotate(10deg)}}
.shade{position:fixed;inset:0;background:radial-gradient(120% 100% at 30% 50%,rgba(0,0,0,.05),rgba(0,0,0,.6))}
#intro{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px}
#intro.show{display:flex}
#intro span{font-size:12px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;opacity:.55}
#intro button{border:0;border-radius:999px;background:#fff;color:#000;font:700 15px Inter,system-ui,sans-serif;padding:15px 34px;cursor:pointer;transition:transform .25s}
#intro button:hover{transform:scale(1.05)}
#idle{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-weight:700;font-size:clamp(18px,2vw,26px);opacity:.55}
body.live.idle #idle{display:flex}
#app{position:fixed;inset:0;display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4vw;align-items:center;padding:0 5vw}
body.live #app{display:grid}
body.live.idle #app{display:none}
.left{width:min(36vw,52vh);justify-self:center}
#art{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#1a1a1a;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:26px;overflow:hidden}
#fill{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.times{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;font-weight:500;opacity:.6;font-variant-numeric:tabular-nums}
#title{margin-top:14px;text-align:center;font-weight:700;font-size:clamp(15px,1.3vw,20px);line-height:1.25;overflow-wrap:break-word}
#sub{margin-top:3px;text-align:center;opacity:.6;font-weight:500;font-size:clamp(13px,1.05vw,16px);line-height:1.3;overflow-wrap:break-word}
.lyrics{position:relative;overflow:hidden;height:100dvh;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
#track{position:absolute;left:0;right:0;top:0;padding:0 28px;transition:transform .65s cubic-bezier(.22,1,.36,1);will-change:transform}
.l{padding:.32em 0;font-weight:800;font-size:clamp(24px,3.2vw,50px);line-height:1.14;letter-spacing:-.022em;overflow-wrap:break-word;opacity:max(.14,calc(.52 - var(--d,9)*.08));filter:blur(calc(min(var(--d,9),6)*.8px)) drop-shadow(0 0 0 rgba(255,255,255,0));transition:opacity .5s,filter .5s}
.l.on{opacity:1;filter:blur(0) drop-shadow(0 0 22px rgba(255,255,255,.22))}
.w{--p:1;background:linear-gradient(90deg,#fff calc(var(--p)*(100% + 14px) - 14px),rgba(255,255,255,.4) calc(var(--p)*(100% + 14px)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
#msg{position:absolute;top:40%;left:28px;right:28px;transform:translateY(-50%);font-weight:700;font-size:clamp(18px,2vw,26px);opacity:.5}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
@media (max-aspect-ratio:1/1){
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:2vh;padding:5vh 6vw 0;align-items:start}
.left{width:min(52vw,30vh)}
.lyrics{height:100%}
}
</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="shade"></div>
<div id="intro"><span>Synchrony</span><button id="go">Connect Spotify</button></div>
<div id="idle">Play a song on Spotify</div>
<main id="app">
<section class="left">
<img id="art" alt="">
<div class="bar"><i id="fill"></i></div>
<div class="times"><span id="te">0:00</span><span id="tr">-0:00</span></div>
<div id="title"></div>
<div id="sub"></div>
</section>
<section class="lyrics" id="ly"><div id="track"></div><div id="msg"></div></section>
</main>
<div id="toast"></div>
<script>
const CID='c361237077b7462180c155eafff8aeda';
const RU=location.origin+location.pathname.replace(/index\.html$/,'');
const SC='user-read-currently-playing user-read-playback-state';
const $=i=>document.getElementById(i);
const E={track:$('track'),ly:$('ly'),msg:$('msg'),fill:$('fill'),te:$('te'),tr:$('tr'),toast:$('toast')};
let tok=null;
try{tok=JSON.parse(localStorage.getItem('sy_t')||'null')}catch{}
let off=+localStorage.getItem('sy_o')||0;
let A={p:0,t:0},playing=false,cur=null,dur=0,delay=1500,busy=false,lines=[],idx=-1,rank=0,lastPoll=0,bi=0,shownT='',shownR='';
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
const v=rnd(96);
localStorage.setItem('sy_v',v);
const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RU,code_challenge_method:'S256',code_challenge:c,scope:SC});
}
async function tk(b){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...b})});
if(!r.ok)throw 1;
const j=await r.json();
tok={a:j.access_token,r:j.refresh_token||(tok&&tok.r),x:Date.now()+j.expires_in*1000};
localStorage.setItem('sy_t',JSON.stringify(tok));
}
async function acc(){
if(!tok)throw 1;
if(Date.now()>tok.x-60000)await tk({grant_type:'refresh_token',refresh_token:tok.r});
return tok.a;
}
function logout(){
tok=null;
localStorage.removeItem('sy_t');
document.body.classList.remove('live','idle');
$('intro').classList.add('show');
}
function idle(){
playing=false;cur=null;lines=[];idx=-1;
document.body.classList.add('live','idle');
}
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const raw=()=>A.p+(playing?performance.now()-A.t:0);
const pos=()=>Math.min(dur,Math.max(0,raw()+off));
function strip(ws){
let d=0;
for(const o of ws){
let r='';
for(const c of o.w){
if(c==='('||c==='[')d++;
else if(c===')'||c===']')d=Math.max(0,d-1);
else if(!d)r+=c;
}
o.w=r.trim();
}
for(let i=ws.length;i--;)if(!ws[i].w)ws.splice(i,1);
}
function build(R){
const out=[];
for(const r of R){
if(!isFinite(r.t))continue;
strip(r.ws);
if(!r.ws.length)continue;
const last=r.ws[r.ws.length-1];
last.w=last.w.replace(/[,;]+$/,'');
const txt=r.ws.map(w=>w.w).join(' ');
const gap=r.n-r.t;
const e=r.e||(gap<=6500?r.t+Math.max(400,gap-100):r.t+txt.length*90+600);
if(r.ws.some(w=>w.s==null)){
const W=r.ws.map(w=>w.w.length+1),T=W.reduce((a,b)=>a+b,0);
let c=r.t;
r.ws.forEach((w,i)=>{w.s=c;c+=(e-r.t)*W[i]/T;w.e=c});
}
out.push({t:r.t,ws:r.ws});
}
return out;
}
function lrcP(s){
const L=[];
for(const r of s.split('\n')){
const m=r.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)(.*)$/);
if(!m)continue;
for(const t of m[1].match(/\d+:\d+(?:[.:]\d+)?/g)){
const q=t.split(':');
L.push({t:(+q[0]*60+parseFloat(q[1]))*1000,x:m[2]});
}
}
L.sort((a,b)=>a.t-b.t);
return build(L.map((e,i)=>({t:e.t,n:i<L.length-1?L[i+1].t:dur,ws:e.x.replace(/<\d+:\d+(?:[.:]\d+)?>/g,'').split(/\s+/).filter(Boolean).map(w=>({w}))})));
}
function ttmlP(x){
const d=new DOMParser().parseFromString(x,'text/xml');
const T=s=>s?s.replace(/s$/,'').split(':').reduce((a,v)=>a*60+parseFloat(v),0)*1000:null;
const R=[];
d.querySelectorAll('p').forEach(p=>{
const ws=[];
let c=null;
p.childNodes.forEach(n=>{
if(n.nodeType===3){if(/\s/.test(n.nodeValue))c=null;return}
if(n.nodeType!==1||/bg/.test(n.getAttribute('ttm:role')||''))return;
const t=n.textContent;
if(!t.trim()){c=null;return}
const e=T(n.getAttribute('end'));
if(c){c.w+=t.trim();c.e=e}
else{c={w:t.trim(),s:T(n.getAttribute('begin')),e};ws.push(c)}
});
const b=T(p.getAttribute('begin')),e=T(p.getAttribute('end'));
if(!ws.length)p.textContent.split(/\s+/).filter(Boolean).forEach(w=>ws.push({w}));
R.push({t:ws[0]&&ws[0].s!=null?Math.min(b,ws[0].s):b,e:ws.every(w=>w.s!=null)?null:e,ws});
});
R.sort((a,b)=>a.t-b.t);
R.forEach((r,i)=>r.n=i<R.length-1?R[i+1].t:dur);
return build(R);
}
function arrP(a){
const R=a.map(o=>({t:+o.startTimeMs,ws:String(o.words||'').split(/\s+/).filter(Boolean).map(w=>({w}))}));
R.forEach((r,i)=>r.n=i<R.length-1?R[i+1].t:dur);
return build(R);
}
function fs(o,f){
if(f(o))return o;
if(o&&typeof o==='object')for(const k in o){const r=fs(o[k],f);if(r)return r}
return null;
}
function any(j){
try{
const t=fs(j,v=>typeof v==='string'&&/<tt[\s>]/.test(v));
if(t)return ttmlP(t);
const l=fs(j,v=>typeof v==='string'&&/\[\d+:\d+/.test(v));
if(l)return lrcP(l);
const a=fs(j,v=>Array.isArray(v)&&v.length&&v[0]&&v[0].startTimeMs!=null);
if(a)return arrP(a);
}catch{}
return null;
}
const jf=u=>fetch(u,{signal:AbortSignal.timeout(7000)}).then(r=>r.ok?r.text():null).then(t=>{if(t==null)return null;try{return JSON.parse(t)}catch{return t}}).catch(()=>null);
function render(){
E.track.innerHTML='';
lines.forEach(l=>{
const d=document.createElement('div');
d.className='l';
l.sp=l.ws.map((w,j)=>{
const s=document.createElement('span');
s.className='w';
s.textContent=w.w;
d.append(s);
if(j<l.ws.length-1)d.append(' ');
return s;
});
E.track.append(d);
l.el=d;
});
idx=-2;
act(-1);
}
function act(n){
const o=lines[idx];
if(o){o.el.classList.remove('on');o.sp.forEach((s,j)=>{s.style.removeProperty('--p');o.ws[j].v=-1})}
idx=n;
lines.forEach((l,i)=>l.el.style.setProperty('--d',Math.abs(i-n)));
if(lines[n])lines[n].el.classList.add('on');
const c=lines[Math.max(n,0)];
if(c)E.track.style.transform='translateY('+(E.ly.clientHeight*.4-(c.el.offsetTop+c.el.offsetHeight/2))+'px)';
}
function set(L,rk,it){
if(cur!==it||rk<rank||!L||!L.length)return;
rank=rk;
lines=L;
E.msg.textContent='';
render();
}
function lyr(it){
const a=it.artists[0].name,s=it.name,al=it.album.name,d=Math.round(it.duration_ms/1000);
let n=2;
const fin=()=>{if(--n===0&&cur===it&&!lines.length)E.msg.textContent='Lyrics unavailable'};
jf('https://lyrics-api.boidu.dev/getLyrics?'+new URLSearchParams({a:a,s:s,d:d})).then(j=>{set(j&&any(j),2,it);fin()});
jf('https://lrclib.net/api/get?'+new URLSearchParams({artist_name:a,track_name:s,album_name:al,duration:d})).then(async r=>{
if(!r||!r.syncedLyrics){
const l=await jf('https://lrclib.net/api/search?'+new URLSearchParams({artist_name:a,track_name:s.replace(/\s*[\(\[-].*$/,'')}));
r=(Array.isArray(l)?l:[]).filter(x=>x.syncedLyrics&&Math.abs(x.duration-d)<=4).sort((x,y)=>Math.abs(x.duration-d)-Math.abs(y.duration-d))[0]||null;
}
if(r&&r.syncedLyrics)set(lrcP(r.syncedLyrics),1,it);
else if(r&&r.instrumental&&cur===it&&!lines.length)E.msg.textContent='Instrumental';
fin();
});
}
function bg(u){
const im=new Image();
im.onload=()=>{
const e=[$('bgA'),$('bgB')];
e[bi].style.backgroundImage='url("'+u+'")';
e[bi].classList.add('on');
e[bi^1].classList.remove('on');
bi^=1;
};
im.src=u;
}
function song(it){
cur=it;dur=it.duration_ms;idx=-1;rank=0;lines=[];
E.track.innerHTML='';
E.track.style.transform='translateY(0)';
E.msg.textContent='';
const u=it.album.images[0]?it.album.images[0].url:'';
$('art').src=u;
$('title').textContent=it.name;
$('sub').textContent=it.artists.map(a=>a.name).join(', ')+' — '+it.album.name;
document.title=it.name+' · '+it.artists[0].name;
if(u)bg(u);
lyr(it);
}
function take(d,mid){
const it=d.item;
if(!it||it.type!=='track'||d.currently_playing_type==='ad'){idle();return}
document.body.classList.add('live');
document.body.classList.remove('idle');
const nt=!cur||cur.id!==it.id;
const before=raw();
if(nt)song(it);
const np=!!d.is_playing;
if(nt||np!==playing||Math.abs(before-d.progress_ms)>90)A={p:d.progress_ms,t:mid};
playing=np;
}
async function poll(){
if(busy)return;
busy=true;
lastPoll=performance.now();
try{
const t0=performance.now();
const r=await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode',{headers:{Authorization:'Bearer '+await acc()}});
const t1=performance.now();
if(r.status===204)idle();
else if(r.status===429)delay=(+r.headers.get('Retry-After')||5)*1000+500;
else if(r.status===401)throw 1;
else if(r.ok){delay=1500;take(await r.json(),(t0+t1)/2)}
}catch(e){if(e===1)logout()}
busy=false;
}
async function loop(){
if(!tok)return;
await poll();
setTimeout(loop,delay);
}
function frame(){
const p=pos();
if(lines.length){
let n=idx;
while(n+1<lines.length&&lines[n+1].t<=p)n++;
while(n>=0&&lines[n].t>p)n--;
if(n!==idx)act(n);
const l=lines[idx];
if(l)l.ws.forEach((w,j)=>{
const x=Math.min(1,Math.max(0,(p-w.s)/Math.max(1,w.e-w.s)));
if(w.v!==x){w.v=x;l.sp[j].style.setProperty('--p',x)}
});
}
if(dur){
E.fill.style.transform='scaleX('+(p/dur)+')';
const a=fmt(p),b='-'+fmt(dur-p);
if(a!==shownT){shownT=a;E.te.textContent=a}
if(b!==shownR){shownR=b;E.tr.textContent=b}
if(playing&&p>=dur-30&&performance.now()-lastPoll>500)poll();
}
requestAnimationFrame(frame);
}
let tt;
addEventListener('keydown',e=>{
const k=e.key;
if(k!=='ArrowLeft'&&k!=='ArrowRight'&&k!=='ArrowUp'&&k!=='ArrowDown')return;
off+=(k==='ArrowRight'||k==='ArrowUp')?50:-50;
localStorage.setItem('sy_o',off);
E.toast.textContent='Sync '+(off>0?'+':'')+off+' ms';
E.toast.classList.add('on');
clearTimeout(tt);
tt=setTimeout(()=>E.toast.classList.remove('on'),1200);
});
addEventListener('resize',()=>{if(lines.length)act(idx)});
$('go').addEventListener('click',login);
(async()=>{
const c=new URLSearchParams(location.search).get('code');
if(c){
history.replaceState(null,'',RU);
try{await tk({grant_type:'authorization_code',code:c,redirect_uri:RU,code_verifier:localStorage.getItem('sy_v')})}catch{}
}
if(tok){loop();requestAnimationFrame(frame)}
else $('intro').classList.add('show');
})();
</script>
</body>
</html>
