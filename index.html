<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; padding: 20px; text-align: center; }
#login-btn { background: #fff; color: #000; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 4px; letter-spacing: 1px; text-transform: uppercase; }
#login-btn:hover { background: #ccc; }
#lyrics-container { display: none; width: 100%; max-width: 800px; height: 70vh; overflow: hidden; flex-direction: column; justify-content: center; align-items: center; position: relative; }
.line { font-size: 2rem; font-weight: 700; color: #333; transition: color 0.15s ease, transform 0.15s ease; margin: 12px 0; line-height: 1.3; }
.line.active { color: #fff; transform: scale(1.05); }
#controls { display: none; position: fixed; bottom: 20px; gap: 10px; align-items: center; background: #0a0a0a; border: 1px solid #222; padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #888; }
#controls button { background: none; border: 1px solid #444; color: #fff; padding: 2px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; }
#controls button:hover { border-color: #fff; }
</style>
</head>
<body>

<button id="login-btn">Connect Spotify</button>

<div id="lyrics-container">
  <div id="lyrics-content"></div>
</div>

<div id="controls">
  <span>OFFSET: <span id="offset-val">0</span> ms</span>
  <button id="dec-offset">-50ms</button>
  <button id="inc-offset">+50ms</button>
</div>

<script>
const CLIENT_ID = 'c361237077b7462180c155eafff8aeda';
const REDIRECT_URI = 'https://thisisthewebsite.github.io/';
const SCOPES = 'user-read-currently-playing user-read-playback-state';

let offsetMs = 0;
let parsedLyrics = [];
let currentTrackId = null;
let pollInterval = null;
let renderInterval = null;
let currentProgressMs = 0;
let lastFetchTime = 0;
let isPlaying = false;

document.getElementById('login-btn').addEventListener('click', redirectToAuth);
document.getElementById('inc-offset').addEventListener('click', () => adjustOffset(50));
document.getElementById('dec-offset').addEventListener('click', () => adjustOffset(-50));

function adjustOffset(delta) {
  offsetMs += delta;
  document.getElementById('offset-val').innerText = (offsetMs >= 0 ? '+' : '') + offsetMs;
}

async function redirectToAuth() {
  const verifier = generateCodeVerifier(128);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem("verifier", verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });
  document.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
}

function generateCodeVerifier(length) {
  let text = '';
  let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  for (let i = 0; i < length; i++) {
    text += possible.charAt(Math.floor(Math.random() * possible.length));
  }
  return text;
}

async function generateCodeChallenge(codeVerifier) {
  const data = new TextEncoder().encode(codeVerifier);
  const digest = await window.crypto.subBuffer ? window.crypto.subBuffer : window.crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function getAccessToken(code) {
  const verifier = localStorage.getItem("verifier");
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const result = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params
  });
  const { access_token, refresh_token } = await result.json();
  localStorage.setItem("access_token", access_token);
  if (refresh_token) localStorage.setItem("refresh_token", refresh_token);
  return access_token;
}

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  let token = localStorage.getItem('access_token');

  if (code) {
    token = await getAccessToken(code);
    window.history.replaceState({}, document.title, "/");
  }

  if (token) {
    document.getElementById('login-btn').style.display = 'none';
    document.getElementById('lyrics-container').style.display = 'flex';
    document.getElementById('controls').style.display = 'flex';
    startSync(token);
  }
}

function startSync(token) {
  pollInterval = setInterval(() => checkSpotifyPlayback(token), 1000);
  checkSpotifyPlayback(token);
  renderInterval = setInterval(updateLyricsDisplay, 30);
}

async function checkSpotifyPlayback(token) {
  try {
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.status === 204 || res.status > 400) return;
    const data = await res.json();
    if (!data || !data.item) return;

    isPlaying = data.is_playing;
    currentProgressMs = data.progress_ms;
    lastFetchTime = performance.now();

    if (data.item.id !== currentTrackId) {
      currentTrackId = data.item.id;
      fetchLyrics(data.item.name, data.item.artists[0].name, data.item.duration_ms / 1000);
    }
  } catch (e) {}
}

async function fetchLyrics(trackName, artistName, durationSec) {
  const content = document.getElementById('lyrics-content');
  content.innerHTML = '<div class="line active">...</div>';
  parsedLyrics = [];

  try {
    const query = new URLSearchParams({
      track_name: trackName,
      artist_name: artistName,
      duration: Math.round(durationSec)
    });
    const res = await fetch(`https://lrclib.net/api/get?${query.toString()}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    if (data.syncedLyrics) {
      parseLrc(data.syncedLyrics);
    } else if (data.plainLyrics) {
      content.innerHTML = `<div class="line active">${data.plainLyrics.replace(/\n/g, '<br>')}</div>`;
    } else {
      content.innerHTML = '<div class="line active">No lyrics found</div>';
    }
  } catch (e) {
    content.innerHTML = '<div class="line active">No lyrics found</div>';
  }
}

function parseLrc(lrcText) {
  const lines = lrcText.split('\n');
  parsedLyrics = [];
  const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

  lines.forEach(line => {
    const match = line.match(regex);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const msStr = match[3].padEnd(3, '0');
      const ms = parseInt(msStr);
      const time = (min * 60 * 1000) + (sec * 1000) + ms;
      const text = match[4].trim();
      if (text) parsedLyrics.push({ time, text });
    }
  });

  const content = document.getElementById('lyrics-content');
  content.innerHTML = parsedLyrics.map((l, i) => `<div class="line" id="line-${i}">${l.text}</div>`).join('');
}

function updateLyricsDisplay() {
  if (!parsedLyrics.length) return;

  let now = currentProgressMs;
  if (isPlaying) {
    now += (performance.now() - lastFetchTime);
  }
  now += offsetMs;

  let activeIdx = -1;
  for (let i = 0; i < parsedLyrics.length; i++) {
    if (now >= parsedLyrics[i].time) {
      activeIdx = i;
    } else {
      break;
    }
  }

  parsedLyrics.forEach((_, i) => {
    const el = document.getElementById(`line-${i}`);
    if (el) {
      if (i === activeIdx) {
        if (!el.classList.contains('active')) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } else {
        el.classList.remove('active');
      }
    }
  });
}

init();
</script>
</body>
</html>
