<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchrony — Live Synced Lyrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0b0e;
            color: #f3f4f6;
        }

        /* Ambient Dynamic Background */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(80px) saturate(180%);
            opacity: 0.25;
            transform: scale(1.2);
            transition: background-image 1s ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(11, 11, 14, 0.85), rgba(5, 5, 7, 0.95));
            z-index: 1;
            pointer-events: none;
        }

        /* Intro Screen */
        #intro-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #0b0b0e;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        .spotify-btn {
            background: #1db954;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spotify-btn:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(29, 185, 84, 0.4);
        }

        /* Main App Screen */
        #main-screen {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: none;
            grid-template-columns: 420px 1fr;
            padding: 60px 80px;
            gap: 80px;
            align-items: center;
        }

        /* Left Column: Player & Album Art */
        .player-column {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 400px;
        }

        .album-art-container {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 255, 255, 0.05);
            background: #1a1a1e;
        }

        .album-art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .track-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.02em;
        }

        .track-artist {
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Progress Bar */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: #ffffff;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.1s linear;
        }

        .time-indicators {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.02em;
        }

        /* Controls */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin-top: 4px;
        }

        .control-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .control-btn.active {
            color: #1db954;
        }

        .control-btn.play-pause {
            width: 48px;
            height: 48px;
            background: #ffffff;
            color: #0b0b0e;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .control-btn.play-pause:hover {
            background: #f0f0f0;
            transform: scale(1.05);
            color: #0b0b0e;
        }

        svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .play-pause svg {
            width: 18px;
            height: 18px;
        }

        /* Right Column: Live Synced Lyrics */
        .lyrics-column {
            height: 75vh;
            overflow-y: scroll;
            position: relative;
            padding: 40px 0;
            scrollbar-width: none; /* Firefox */
        }

        .lyrics-column::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .lyrics-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .lyric-line {
            font-size: 2.25rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25);
            line-height: 1.3;
            cursor: default;
            transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
            letter-spacing: -0.03em;
        }

        .lyric-line.active {
            color: #ffffff;
            text-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        .no-lyrics {
            font-size: 1.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 40px;
        }

        /* Responsive */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>
    <div class="ambient-overlay"></div>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="logo-text">Synchrony</div>
        <button class="spotify-btn" id="loginBtn">
            <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#fff;"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.72.48-1.08.24-2.999-1.8-6.78-2.221-11.22-1.201-.419.12-.84-.12-.96-.539-.12-.42.12-.84.54-.96 4.8-1.14 9.06-.66 12.42 1.5.36.24.48.72.3 1.08zm1.56-3.48c-.3.48-.9.66-1.38.36-3.48-2.16-8.82-2.76-12.96-1.5-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.62-1.38 10.44-.72 14.46 1.8.48.3.66.9.54 1.32zm.12-3.66C14.58 7.92 8.46 7.74 4.92 8.82c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 4.08-1.26 10.92-1.08 15.42 1.62.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
            Connect with Spotify
        </button>
    </div>

    <!-- Main Screen -->
    <div id="main-screen">
        <!-- Left: Album Art & Controls -->
        <div class="player-column animate-in">
            <div class="album-art-container">
                <img id="albumArt" src="" alt="Album Art">
            </div>
            <div class="track-meta">
                <div class="track-title" id="trackTitle">Loading...</div>
                <div class="track-artist" id="trackArtist">Please wait</div>
            </div>
            <div class="progress-section">
                <div class="progress-bar-bg" id="progressBarBg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="time-indicators">
                    <span id="currentTime">0:00</span>
                    <span id="remainingTime">-0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="shuffleBtn" title="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.18 1.42-1.42zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.42 1.42 3.58 3.58L14.5 18 20 18v-5.5l-2.04 2.04-3.63-3.63z"/></svg>
                </button>
                <button class="control-btn" id="prevBtn" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="control-btn play-pause" id="playPauseBtn" title="Play/Pause">
                    <svg id="playIcon" viewBox="0 0 24 24" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="control-btn" id="nextBtn" title="Next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="control-btn" id="repeatBtn" title="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
        </div>

        <!-- Right: Live Synced Lyrics -->
        <div class="lyrics-column animate-in" id="lyricsColumn">
            <div class="lyrics-container" id="lyricsContainer">
                <div class="no-lyrics">Waiting for music...</div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'c361237077b7462180c155eafff8aeda';
        const REDIRECT_URI = 'https://thisisthewebsite.github.io/';
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

        // PKCE Helper Functions
        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)]))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        // Login Handler
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const codeVerifier = generateRandomString(64);
            localStorage.setItem('code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', CLIENT_ID);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', REDIRECT_URI);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', codeChallenge);
            authUrl.searchParams.append('scope', SCOPES);

            window.location.href = authUrl.toString();
        });

        // Exchange Authorization Code for Token
        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const codeVerifier = localStorage.getItem('code_verifier');
                const body = new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier
                });

                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });
                    const data = await response.json();
                    if (data.access_token) {
                        localStorage.setItem('spotify_access_token', data.access_token);
                        window.history.replaceState({}, document.title, '/');
                        showMainApp();
                    }
                } catch (e) {
                    console.error('Token exchange failed', e);
                }
            } else if (localStorage.getItem('spotify_access_token')) {
                showMainApp();
            }
        }

        function showMainApp() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'grid';
            startPolling();
        }

        // Playback & Lyrics State
        let currentTrackId = null;
        let lyricsData = [];
        let activeLineIndex = -1;
        let isPlaying = false;
        let songDurationMs = 0;
        let progressMs = 0;
        let lastUpdateTimestamp = Date.now();

        async function fetchCurrentlyPlaying() {
            const token = localStorage.getItem('spotify_access_token');
            if (!token) return;

            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 204 || res.status === 401) {
                    if (res.status === 401) localStorage.removeItem('spotify_access_token');
                    return;
                }
                const data = await res.json();
                if (!data || !data.item) return;

                isPlaying = data.is_playing;
                progressMs = data.progress_ms;
                lastUpdateTimestamp = Date.now();
                songDurationMs = data.item.duration_ms;

                updatePlayPauseIcon(isPlaying);
                updateProgressUI();

                const track = data.item;
                if (track.id !== currentTrackId) {
                    currentTrackId = track.id;
                    updateTrackUI(track);
                    fetchLyrics(track.artists[0].name, track.name, track.album.name, Math.round(track.duration_ms / 1000));
                }
            } catch (e) {
                console.error('Failed to fetch player state', e);
            }
        }

        function updateTrackUI(track) {
            document.getElementById('trackTitle').textContent = track.name;
            document.getElementById('trackArtist').textContent = track.artists.map(a => a.name).join(', ');
            const artUrl = track.album.images[0]?.url || '';
            document.getElementById('albumArt').src = artUrl;
            document.getElementById('ambientBg').style.backgroundImage = `url('${artUrl}')`;
        }

        function updatePlayPauseIcon(playing) {
            document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
            document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
        }

        function formatTime(ms) {
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function formatRemainingTime(currentMs, totalMs) {
            const remainingMs = Math.max(0, totalMs - currentMs);
            const totalSecs = Math.floor(remainingMs / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            return `-${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressUI() {
            if (isPlaying) {
                const elapsed = Date.now() - lastUpdateTimestamp;
                progressMs = Math.min(songDurationMs, progressMs + elapsed);
                lastUpdateTimestamp = Date.now();
            }

            const percent = songDurationMs > 0 ? (progressMs / songDurationMs) * 100 : 0;
            document.getElementById('progressBarFill').style.width = `${percent}%`;
            document.getElementById('currentTime').textContent = formatTime(progressMs);
            document.getElementById('remainingTime').textContent = formatRemainingTime(progressMs, songDurationMs);

            updateActiveLyric(progressMs / 1000);
        }

        // Fetch Lyrics from LRCLIB API
        async function fetchLyrics(artist, title, album, duration) {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '<div class="no-lyrics">Loading lyrics...</div>';
            lyricsData = [];
            activeLineIndex = -1;

            try {
                let url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}&album_name=${encodeURIComponent(album)}&duration=${duration}`;
                let res = await fetch(url);
                
                if (!res.ok) {
                    // Fallback search
                    const searchUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(artist + ' ' + title)}`;
                    const searchRes = await fetch(searchUrl);
                    const searchData = await searchRes.json();
                    if (searchData && searchData.length > 0) {
                        const match = searchData.find(item => item.syncedLyrics);
                        if (match) {
                            parseLrc(match.syncedLyrics);
                            return;
                        }
                    }
                    container.innerHTML = '<div class="no-lyrics">Instrumental or No Synced Lyrics Available</div>';
                    return;
                }

                const data = await res.json();
                if (data && data.syncedLyrics) {
                    parseLrc(data.syncedLyrics);
                } else if (data && data.plainLyrics) {
                    container.innerHTML = `<div class="no-lyrics" style="white-space: pre-line; font-size: 1.25rem; color: rgba(255,255,255,0.6);">${escapeHtml(data.plainLyrics)}</div>`;
                } else {
                    container.innerHTML = '<div class="no-lyrics">No lyrics found</div>';
                }
            } catch (e) {
                console.error('Error fetching lyrics', e);
                container.innerHTML = '<div class="no-lyrics">Failed to load lyrics</div>';
            }
        }

        // Parse LRC format & Filter Adlibs
        function parseLrc(lrcString) {
            const lines = lrcString.split('\n');
            lyricsData = [];
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            for (let line of lines) {
                const match = timeRegex.exec(line);
                if (match) {
                    const mins = parseInt(match[1], 10);
                    const secs = parseInt(match[2], 10);
                    const millis = parseInt(match[3].padEnd(3, '0'), 10);
                    const timeInSeconds = mins * 60 + secs + millis / 1000;
                    
                    let text = line.replace(timeRegex, '').trim();
                    
                    // Exclude pure background adlibs enclosed entirely in parentheses or brackets (e.g., [yeah], (ooh))
                    if (/^\s*[\[\(].*[\)\]]\s*$/.test(text)) {
                        continue;
                    }

                    if (text.length > 0) {
                        lyricsData.push({ time: timeInSeconds, text: text });
                    }
                }
            }

            renderLyricsDOM();
        }

        function renderLyricsDOM() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';
            lyricsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.textContent = item.text;
                div.dataset.index = index;
                container.appendChild(div);
            });
        }

        function updateActiveLyric(currentTimeSec) {
            if (lyricsData.length === 0) return;

            let newIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTimeSec >= lyricsData[i].time) {
                    newIndex = i;
                } else {
                    break;
                }
            }

            if (newIndex !== activeLineIndex) {
                activeLineIndex = newIndex;
                const lineElements = document.querySelectorAll('.lyric-line');
                lineElements.forEach((el, idx) => {
                    if (idx === activeLineIndex) {
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        el.classList.remove('active');
                    }
                });
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Control Actions
        document.getElementById('playPauseBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('spotify_access_token');
            if (!token) return;
            const endpoint = isPlaying ? 'pause' : 'play';
            await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            setTimeout(fetchCurrentlyPlaying, 300);
        });

        document.getElementById('nextBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('spotify_access_token');
            if (!token) return;
            await fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            setTimeout(fetchCurrentlyPlaying, 400);
        });

        document.getElementById('prevBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('spotify_access_token');
            if (!token) return;
            await fetch('https://api.spotify.com/v1/me/player/previous', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            setTimeout(fetchCurrentlyPlaying, 400);
        });

        // Seek on progress bar click
        document.getElementById('progressBarBg').addEventListener('click', async (e) => {
            const token = localStorage.getItem('spotify_access_token');
            if (!token || songDurationMs === 0) return;
            const rect = e.target.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const seekPercent = clickX / width;
            const seekMs = Math.round(seekPercent * songDurationMs);

            await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${seekMs}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            progressMs = seekMs;
            lastUpdateTimestamp = Date.now();
            updateProgressUI();
        });

        // Polling loop
        function startPolling() {
            fetchCurrentlyPlaying();
            setInterval(fetchCurrentlyPlaying, 1500);
            setInterval(updateProgressUI, 100);
        }

        // Initialize on load
        window.addEventListener('load', () => {
            handleRedirect();
        });
    </script>
</body>
</html>
