<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>untitled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f2ee;--dim:rgba(244,242,238,.3);--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--paper:#f4f2ee;--night:#16141a}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#0d0c10;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.bg{position:fixed;inset:-20%;background:center/cover;filter:blur(90px) saturate(1.7) brightness(.5);opacity:0;transition:opacity 1.2s}
.bg.on{opacity:1}
.veil{position:fixed;inset:0;background:radial-gradient(90% 70% at 15% 0,rgba(255,255,255,.07),transparent 60%),linear-gradient(transparent 55%,rgba(0,0,0,.4))}
.screen{position:fixed;inset:0;display:none}
body[data-s=auth] #auth,body[data-s=search] #search{display:flex}
body[data-s=game] #game{display:grid}
.brand{position:fixed;top:28px;left:7vw;font-weight:800;letter-spacing:-.04em;font-size:22px}
.btn{height:56px;padding:0 30px;border-radius:99px;background:var(--paper);color:var(--night);font-weight:600;font-size:17px;transition:transform .2s,opacity .2s}
.btn:hover:not(:disabled){transform:scale(1.04)}
.btn:disabled{opacity:.35;cursor:default}
#auth{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 7vw;gap:28px}
#auth h1{font-size:clamp(72px,16vw,220px);line-height:.85;font-weight:800;letter-spacing:-.065em}
#auth p{font-size:20px;color:rgba(244,242,238,.6);max-width:30ch;line-height:1.35}
#auth small{color:var(--dim);font-size:14px}
#search{flex-direction:column;padding:16vh 7vw 0;align-items:flex-start}
#q{width:min(760px,100%);background:none;border:0;border-bottom:2px solid var(--line);color:var(--ink);font-family:inherit;font-weight:800;font-size:clamp(34px,5vw,64px);line-height:1.1;letter-spacing:-.04em;padding:0 0 14px;outline:0;transition:border-color .3s}
#q:focus{border-color:var(--paper)}
#q::placeholder{color:var(--dim)}
#res{width:min(760px,100%);margin-top:20px;overflow:auto;max-height:58vh;display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:14px;text-align:left;transition:background .2s}
.r:hover,.r:focus-visible{background:var(--glass)}
.r img{width:52px;height:52px;border-radius:8px;background:#222}
.r b{display:block;font-weight:600;font-size:18px}
.r i{display:block;font-style:normal;color:rgba(244,242,238,.55);font-size:15px;margin-top:2px}
#game{grid-template-columns:minmax(300px,430px) 1fr;gap:6vw;align-items:center;padding:0 7vw}
.left{display:flex;flex-direction:column;gap:20px}
.cover{width:100%;aspect-ratio:1;border-radius:20px;background:#222 center/cover;box-shadow:0 40px 90px rgba(0,0,0,.55)}
[data-m=listen] .cover{animation:breathe 1.1s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025)}}
.meta h2{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.meta p{color:rgba(244,242,238,.55);margin-top:4px}
.bar{height:4px;border-radius:4px;background:var(--glass);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--paper)}
.tm{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.ghost{height:42px;padding:0 20px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:15px;transition:background .2s}
.ghost:hover{background:rgba(255,255,255,.16)}
[data-m=ready] #pp{visibility:hidden}
.right{position:relative;height:100vh}
.pill{position:absolute;top:8vh;left:0;z-index:2;display:flex;align-items:center;gap:12px;height:46px;padding:0 20px 0 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);font-weight:600;font-size:16px;transition:background .25s,color .25s,opacity .3s}
[data-m=ready] .pill{opacity:0}
[data-m=type] .pill,[data-m=hold] .pill{background:var(--paper);color:var(--night);border-color:transparent}
.pill em{font-style:normal;font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:3px;align-items:center;height:16px}
.bars i{width:3px;height:5px;border-radius:2px;background:currentColor}
[data-m=listen] .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s!important}
.bars i:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{50%{height:16px}}
.lyr{position:absolute;inset:0;overflow:hidden;transition:opacity .4s;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
[data-m=listen] .lyr{opacity:.4}
.rail{position:relative;padding:50vh 0;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.ln{font-size:clamp(24px,3vw,44px);font-weight:800;line-height:1.14;letter-spacing:-.025em;padding:.28em 0;white-space:pre-wrap;opacity:max(.12,calc(1 - var(--d,6)*.2));filter:blur(calc(var(--d,6)*.7px));transition:opacity .5s,filter .5s}
.ln .t{color:var(--dim);transition:color .15s}
.ln .t.k{color:#fff}
.ln .a{font-weight:500;font-style:italic;color:rgba(244,242,238,.15)}
.ln .t.c{box-shadow:-2px 0 0 #fff;animation:blink 1s steps(2) infinite}
[data-m=listen] .ln .t.c{box-shadow:none;animation:none}
@keyframes blink{50%{box-shadow:-2px 0 0 transparent}}
#ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:22px}
#ov p{font-size:clamp(26px,3vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:16ch}
#ov small{display:block;font-size:16px;font-weight:400;letter-spacing:0;color:rgba(244,242,238,.55);margin-top:12px;max-width:34ch;line-height:1.4}
#nt{position:fixed;bottom:32px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 22px;border-radius:99px;background:var(--paper);color:var(--night);font-weight:600;transition:.3s;z-index:9}
#nt.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){#game{grid-template-columns:1fr;padding:0 6vw}.left{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-s="auth" data-m="ready">
<div class="bg" id="bg"></div>
<div class="veil"></div>

<section class="screen" id="auth">
<h1>untitled</h1>
<p>Type the lyrics as they're sung. Wait out the beat.</p>
<button class="btn" id="login">Connect Spotify</button>
<small>Playback needs Spotify Premium.</small>
</section>

<section class="screen" id="search">
<div class="brand">untitled</div>
<input id="q" placeholder="Search a song" autocomplete="off" spellcheck="false">
<div id="res"></div>
</section>

<section class="screen" id="game">
<div class="left">
<div class="cover" id="cover"></div>
<div class="meta"><h2 id="ttl"></h2><p id="art"></p></div>
<div><div class="bar"><i id="fill"></i></div><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div></div>
<div class="row"><button class="ghost" id="pp">Pause</button><button class="ghost" id="back">Songs</button></div>
</div>
<div class="right">
<div class="pill"><span class="bars"><i></i><i></i><i></i></span><span id="pt"></span><em id="cd"></em></div>
<div class="lyr" id="lyr"><div class="rail" id="rail"></div></div>
<div id="ov"><p id="ovt"></p><button class="btn" id="go" disabled>Play</button></div>
</div>
</section>
<div id="nt"></div>

<script>
const CID='c361237077b7462180c155eafff8aeda';
const RU=location.origin+location.pathname;
const SC='streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
const LEAD=300;
const TXT={listen:'Listen',type:'Your turn',hold:'Finish the line to continue',paused:'Paused',done:'Complete',end:'Song ended',ready:''};
const $=id=>document.getElementById(id);
const show=s=>{document.body.dataset.s=s};
let player,dev,cur,lines=[],li=0,ci=0,mode='ready',started=false,userPaused=false,holdPaused=false,seen=0,tm,ntm;
let st={position:0,paused:true,ts:0,duration:1};

const note=m=>{const n=$('nt');n.textContent=m;n.classList.add('on');clearTimeout(ntm);ntm=setTimeout(()=>n.classList.remove('on'),4200)};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const saved=()=>JSON.parse(localStorage.getItem('tk')||'{}');
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const nm=c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));
  localStorage.setItem('v',v);
  const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RU,scope:SC,code_challenge_method:'S256',code_challenge:c});
}

async function tok(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...body})});
  if(!r.ok)return false;
  const j=await r.json();
  localStorage.setItem('tk',JSON.stringify({a:j.access_token,r:j.refresh_token||saved().r,x:Date.now()+j.expires_in*1000}));
  return true;
}

async function token(){
  const s=saved();
  if(s.a&&Date.now()<s.x-60000)return s.a;
  if(s.r&&await tok({grant_type:'refresh_token',refresh_token:s.r}))return saved().a;
  localStorage.removeItem('tk');
  show('auth');
  return '';
}

async function api(path,opt={}){
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
  return r.ok&&r.status!==204?r.json():null;
}

function initPlayer(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    player=new Spotify.Player({name:'untitled',getOAuthToken:async cb=>cb(await token()),volume:.8});
    player.addListener('ready',e=>{dev=e.device_id;arm()});
    player.addListener('player_state_changed',s=>{if(s)sync(s)});
    player.addListener('account_error',()=>note('Spotify Premium is required to play music.'));
    player.addListener('authentication_error',()=>show('auth'));
    player.connect();
  };
  const s=document.createElement('script');
  s.src='https://sdk.scdn.co/spotify-player.js';
  document.head.append(s);
}

const sync=s=>{st={position:s.position,paused:s.paused,ts:performance.now(),duration:s.duration}};
const pos=()=>st.paused?st.position:Math.min(st.duration,st.position+performance.now()-st.ts);
const arm=()=>{$('go').disabled=!(dev&&lines.length)};

setInterval(async()=>{
  if(player&&started){const s=await player.getCurrentState();if(s)sync(s)}
},1000);

function lrc(s){
  const r=[];
  for(const l of s.split('\n')){
    const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text=l.replace(/\[\d+:\d+(?:\.\d+)?\]/g,'').trim();
    if(text)m.forEach(x=>r.push({time:(+x[1]*60+ +x[2])*1000,text}));
  }
  return r.sort((a,b)=>a.time-b.time);
}

async function getLyrics(t){
  const a=t.artists[0].name,n=t.name,d=Math.round(t.duration_ms/1000);
  const clean=n.replace(/\s*[\(\[\-].*$/,'').trim()||n;
  const q=o=>new URLSearchParams(o).toString();
  const tries=[
    'get?'+q({artist_name:a,track_name:n,album_name:t.album.name,duration:d}),
    'get?'+q({artist_name:a,track_name:clean,duration:d}),
    'search?'+q({artist_name:a,track_name:clean})
  ];
  for(const u of tries){
    try{
      const r=await fetch('https://lrclib.net/api/'+u);
      if(!r.ok)continue;
      const j=await r.json();
      const hit=(Array.isArray(j)?j:[j]).filter(x=>x&&x.syncedLyrics).sort((x,y)=>Math.abs(x.duration-d)-Math.abs(y.duration-d))[0];
      if(hit)return lrc(hit.syncedLyrics);
    }catch{}
  }
  return [];
}

function build(text){
  const out=[];
  let depth=0,prevSp=true,last=-1;
  for(const ch of text){
    if(ch==='('||ch==='['){depth++;out.push({ch,a:1,t:0});continue}
    if(ch===')'||ch===']'){depth=Math.max(0,depth-1);out.push({ch,a:1,t:0});continue}
    if(depth){out.push({ch,a:1,t:0});continue}
    let t=0;
    if(ch===' '){t=prevSp?0:1;if(t)prevSp=true}
    else if(/[\p{L}\p{N}]/u.test(ch)){t=1;prevSp=false;last=out.length}
    out.push({ch,a:0,t});
  }
  out.forEach((x,i)=>{if(i>last)x.t=0});
  return out;
}

function render(ls){
  $('rail').innerHTML='';
  lines=ls.map(o=>{
    const el=document.createElement('div');
    el.className='ln';
    const c=build(o.text).map(x=>{
      const e=document.createElement('span');
      e.className=x.a?'a':'t';
      e.textContent=x.ch;
      el.append(e);
      return {...x,e};
    });
    $('rail').append(el);
    return {time:o.time,el,c};
  });
  li=0;ci=0;seen=0;
  settle();
  focus();
}

function focus(){
  if(!lines.length)return;
  lines.forEach((L,i)=>L.el.style.setProperty('--d',Math.min(Math.abs(i-li),6)));
  const L=lines[li]||lines[lines.length-1];
  $('rail').style.transform='translateY('+($('lyr').clientHeight*.42-(L.el.offsetTop+L.el.offsetHeight/2))+'px)';
}

function settle(){
  for(;;){
    const L=lines[li];
    if(!L){focus();return}
    while(ci<L.c.length&&!L.c[ci].t){if(!L.c[ci].a)L.c[ci].e.classList.add('k');ci++}
    if(ci<L.c.length){L.c[ci].e.classList.add('c');return}
    li++;ci=0;
    if(holdPaused){holdPaused=false;player.resume()}
    focus();
  }
}

addEventListener('keydown',e=>{
  if(document.body.dataset.s!=='game'||mode!=='type'||e.metaKey||e.ctrlKey||e.altKey||e.key.length!==1)return;
  e.preventDefault();
  const L=lines[li];
  if(!L)return;
  const x=L.c[ci];
  if(nm(e.key)!==nm(x.ch))return;
  x.e.classList.remove('c');
  x.e.classList.add('k');
  ci++;
  settle();
});

function frame(){
  requestAnimationFrame(frame);
  if(!started||document.body.dataset.s!=='game')return;
  const p=pos(),L=lines[li],n=lines[li+1];
  seen=Math.max(seen,p);
  let m;
  if(!L)m='done';
  else if(userPaused)m='paused';
  else if(seen>=st.duration-1500&&st.paused&&!holdPaused)m='end';
  else if(p<L.time-LEAD)m='listen';
  else if(n&&p>=n.time-150){m='hold';if(!holdPaused){holdPaused=true;player.pause()}}
  else m='type';
  if(m!==mode){mode=m;document.body.dataset.m=m;$('pt').textContent=TXT[m]}
  $('cd').textContent=m==='listen'?((L.time-p)/1000).toFixed(1)+'s':'';
  $('fill').style.width=(p/st.duration*100)+'%';
  $('t1').textContent=fmt(p);
  $('t2').textContent=fmt(st.duration);
}
requestAnimationFrame(frame);

async function pick(t){
  cur=t;
  started=false;userPaused=false;holdPaused=false;lines=[];
  mode='ready';
  document.body.dataset.m='ready';
  show('game');
  const img=t.album.images[0]?t.album.images[0].url:'';
  $('cover').style.backgroundImage='url('+img+')';
  $('bg').style.backgroundImage='url('+img+')';
  $('bg').classList.add('on');
  $('ttl').textContent=t.name;
  $('art').textContent=t.artists.map(a=>a.name).join(', ');
  $('rail').innerHTML='';
  $('fill').style.width='0';
  $('t1').textContent='0:00';
  $('t2').textContent=fmt(t.duration_ms);
  $('pp').textContent='Pause';
  $('ov').hidden=false;
  $('go').hidden=true;
  $('ovt').textContent='Finding lyrics';
  const ls=await getLyrics(t);
  if(cur!==t)return;
  if(!ls.length){
    $('ovt').innerHTML='No synced lyrics for this song.<small>Pick another one.</small>';
    return;
  }
  render(ls);
  $('ovt').innerHTML='Type each lyric as it\'s sung.<small>Only correct letters register. When only the beat plays, wait for the next line.</small>';
  $('go').hidden=false;
  arm();
}

$('go').onclick=async()=>{
  player.activateElement();
  await api('/me/player/play?device_id='+dev,{method:'PUT',body:JSON.stringify({uris:[cur.uri]})});
  started=true;
  $('ov').hidden=true;
};

$('pp').onclick=()=>{
  userPaused=!userPaused;
  holdPaused=false;
  $('pp').textContent=userPaused?'Resume':'Pause';
  if(userPaused)player.pause();else player.resume();
};

$('back').onclick=()=>{
  if(player&&started)player.pause();
  started=false;cur=null;
  $('bg').classList.remove('on');
  show('search');
  $('q').focus();
};

$('login').onclick=login;

$('q').oninput=()=>{
  clearTimeout(tm);
  tm=setTimeout(async()=>{
    const v=$('q').value.trim();
    const res=$('res');
    if(!v){res.innerHTML='';return}
    const j=await api('/search?type=track&limit=10&q='+encodeURIComponent(v));
    res.innerHTML='';
    ((j&&j.tracks&&j.tracks.items)||[]).forEach(t=>{
      const b=document.createElement('button');
      b.className='r';
      const im=t.album.images.length?t.album.images[t.album.images.length-1].url:'';
      b.innerHTML='<img alt="" src="'+im+'"><span><b></b><i></i></span>';
      b.querySelector('b').textContent=t.name;
      b.querySelector('i').textContent=t.artists.map(a=>a.name).join(', ');
      b.onclick=()=>pick(t);
      res.append(b);
    });
  },320);
};

addEventListener('resize',focus);

(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('code')){
    await tok({grant_type:'authorization_code',code:p.get('code'),redirect_uri:RU,code_verifier:localStorage.getItem('v')});
    history.replaceState(null,'',RU);
  }
  if(await token()){show('search');initPlayer();$('q').focus()}
})();
</script>
</body>
</html>
