<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyrics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#login button{background:none;border:1px solid #fff;color:#fff;padding:14px 30px;font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
#login button:hover{background:#fff;color:#000}
#lyrics{position:fixed;inset:0;overflow-y:auto;scrollbar-width:none;display:none}
#lyrics::-webkit-scrollbar{display:none}
#inner{padding:45vh 8vw;text-align:center}
.line{font-size:clamp(24px,4.2vw,46px);font-weight:700;line-height:1.25;padding:.32em 0;min-height:1.2em;opacity:.18;transition:opacity .18s}
.line.on{opacity:1}
.plain .line{opacity:1;font-weight:500;padding:.1em 0}
#adj{position:fixed;right:16px;bottom:12px;display:none;align-items:center;gap:10px;font-size:12px;opacity:.25;transition:opacity .2s;user-select:none}
#adj:hover{opacity:1}
#adj button{background:none;border:0;color:#fff;font:inherit;font-size:16px;cursor:pointer;padding:2px 6px}
#adj span{min-width:64px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div id="login"><button id="go">Connect Spotify</button></div>
<div id="lyrics"><div id="inner"></div></div>
<div id="adj"><button id="m">−</button><span id="v">0 ms</span><button id="p">+</button></div>
<script>
const CID="c361237077b7462180c155eafff8aeda";
const RURI="https://thisisthewebsite.github.io/";
const STEP=50;
const $=id=>document.getElementById(id);
const ls=localStorage;

const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);const c="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";return Array.from(a,x=>c[x%62]).join("")};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function login(){
const v=rnd(96);
ls.setItem("v",v);
const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CID,response_type:"code",redirect_uri:RURI,scope:"user-read-currently-playing user-read-playback-state",code_challenge_method:"S256",code_challenge:c});
}

async function tok(body){
try{
const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CID,...body})});
if(!r.ok)return false;
const d=await r.json();
ls.setItem("at",d.access_token);
ls.setItem("exp",String(Date.now()+d.expires_in*1000-60000));
if(d.refresh_token)ls.setItem("rt",d.refresh_token);
return true;
}catch(e){return false}
}

async function token(){
if(Date.now()<+ls.getItem("exp"))return ls.getItem("at");
const rt=ls.getItem("rt");
if(rt&&await tok({grant_type:"refresh_token",refresh_token:rt}))return ls.getItem("at");
return null;
}

let id=null,lines=[],plain=false,pos0=0,t0=0,playing=false,active=-2,els=[],off=+ls.getItem("off")||0,running=false;

const pos=()=>playing?pos0+performance.now()-t0:pos0;

function setOff(n){
off=n;
ls.setItem("off",String(n));
$("v").textContent=(n>0?"+":"")+n+" ms";
}

function parse(s){
const o=[];
s.split("\n").forEach(l=>{
const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
const t=l.replace(/\[[^\]]*\]/g,"").trim();
m.forEach(x=>o.push({t:(+x[1]*60+ +x[2])*1000,s:t}));
});
return o.sort((a,b)=>a.t-b.t);
}

function render(a){
$("inner").innerHTML="";
$("lyrics").classList.toggle("plain",plain);
els=a.map(x=>{const d=document.createElement("div");d.className="line";d.textContent=x.s;$("inner").appendChild(d);return d});
active=-2;
$("lyrics").scrollTop=0;
}

async function getJSON(u){
try{const r=await fetch(u);if(r.ok)return await r.json()}catch(e){}
return null;
}

async function fetchLyrics(it){
const dur=it.duration_ms/1000;
const artist=it.artists[0].name;
let j=await getJSON("https://lrclib.net/api/get?"+new URLSearchParams({track_name:it.name,artist_name:artist,album_name:it.album.name,duration:Math.round(dur)}));
if(j&&j.syncedLyrics&&Math.abs((j.duration||dur)-dur)<=3)return j;
const all=[];
const s1=await getJSON("https://lrclib.net/api/search?"+new URLSearchParams({track_name:it.name,artist_name:artist}));
if(s1)all.push(...s1);
const s2=await getJSON("https://lrclib.net/api/search?"+new URLSearchParams({q:it.name+" "+artist}));
if(s2)all.push(...s2);
const best=all.filter(x=>x.syncedLyrics&&Math.abs(x.duration-dur)<=3).sort((a,b)=>Math.abs(a.duration-dur)-Math.abs(b.duration-dur))[0];
if(best)return best;
if(j&&(j.syncedLyrics||j.plainLyrics))return j;
return all.find(x=>x.plainLyrics)||null;
}

async function load(it){
const mine=it.id;
lines=[];plain=false;render([]);
const j=await fetchLyrics(it);
if(id!==mine)return;
if(j&&j.syncedLyrics){
lines=parse(j.syncedLyrics);
plain=false;
}else if(j&&j.plainLyrics){
lines=j.plainLyrics.split("\n").map(s=>({t:0,s:s.trim()}));
plain=true;
}
render(lines);
}

async function poll(){
const t=await token();
if(!t){running=false;$("lyrics").style.display="none";$("adj").style.display="none";$("login").style.display="flex";return}
const s=performance.now();
let r;
try{r=await fetch("https://api.spotify.com/v1/me/player/currently-playing",{headers:{Authorization:"Bearer "+t}})}catch(e){return}
const e=performance.now();
if(r.status===401){ls.setItem("exp","0");return}
if(r.status!==200){
playing=false;
if(id){id=null;lines=[];render([])}
return;
}
let d;
try{d=await r.json()}catch(x){return}
if(!d||!d.item||d.currently_playing_type!=="track"){
playing=false;
if(id){id=null;lines=[];render([])}
return;
}
const mid=(s+e)/2;
const cur=pos0+(mid-t0);
const wasPlaying=playing;
playing=d.is_playing;
if(d.item.id!==id){
id=d.item.id;
pos0=d.progress_ms;t0=mid;
load(d.item);
}else if(wasPlaying&&playing&&Math.abs(cur-d.progress_ms)<400){
pos0=cur+(d.progress_ms-cur)*.35;t0=mid;
}else{
pos0=d.progress_ms;t0=mid;
}
}

async function loop(){
while(running){
await poll();
await new Promise(r=>setTimeout(r,1500));
}
}

function frame(){
if(running&&!plain&&lines.length){
const p=pos()+off;
let lo=0,hi=lines.length-1,i=-1;
while(lo<=hi){
const m=(lo+hi)>>1;
if(lines[m].t<=p){i=m;lo=m+1}else hi=m-1;
}
if(i!==active){
if(els[active])els[active].classList.remove("on");
active=i;
if(els[i]){
els[i].classList.add("on");
if(lines[i].s){
const box=$("lyrics");
box.scrollTo({top:els[i].offsetTop-box.clientHeight/2+els[i].offsetHeight/2,behavior:"smooth"});
}
}else{
$("lyrics").scrollTo({top:0,behavior:"smooth"});
}
}
}
requestAnimationFrame(frame);
}

function start(){
$("login").style.display="none";
$("lyrics").style.display="block";
$("adj").style.display="flex";
setOff(off);
running=true;
loop();
}

$("go").onclick=login;
$("m").onclick=()=>setOff(off-STEP);
$("p").onclick=()=>setOff(off+STEP);
$("v").onclick=()=>setOff(0);
document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")setOff(off-STEP);
if(e.key==="ArrowRight")setOff(off+STEP);
});

(async()=>{
const code=new URLSearchParams(location.search).get("code");
if(code){
await tok({grant_type:"authorization_code",code,redirect_uri:RURI,code_verifier:ls.getItem("v")});
history.replaceState({},"",RURI);
}
requestAnimationFrame(frame);
if(await token())start();
})();
</script>
</body>
</html>
