<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live Lyrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0c;
      --accent-1: #3b2d54;
      --accent-2: #1c2b42;
      --accent-3: #4a2121;
      --glow-color: rgba(255, 255, 255, 0.1);
      --text-active: #ffffff;
      --text-inactive: rgba(255, 255, 255, 0.36);
      --text-future-word: rgba(255, 255, 255, 0.42);
      --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-primary);
      font-family: var(--font-main);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Dynamic Mesh Background */
    .ambient-container {
      position: fixed;
      inset: -50px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      filter: blur(85px) saturate(180%);
      transition: opacity 1.2s ease;
      transform: translateZ(0);
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      opacity: 0.65;
      animation: drift 22s infinite alternate ease-in-out;
      will-change: transform;
    }

    .blob-1 {
      width: 65vw;
      height: 65vw;
      top: -10%;
      left: -10%;
      background: radial-gradient(circle, var(--accent-1) 0%, transparent 70%);
      animation-duration: 25s;
    }

    .blob-2 {
      width: 70vw;
      height: 70vw;
      bottom: -15%;
      right: -10%;
      background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
      animation-duration: 30s;
      animation-direction: alternate-reverse;
    }

    .blob-3 {
      width: 50vw;
      height: 50vw;
      top: 30%;
      left: 35%;
      background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
      animation-duration: 20s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(6%, 8%) scale(1.08) rotate(45deg); }
      100% { transform: translate(-5%, -6%) scale(0.95) rotate(-30deg); }
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 50%, rgba(10, 10, 12, 0.25) 0%, rgba(8, 8, 10, 0.82) 100%);
      pointer-events: none;
    }

    /* Subtle Film Grain (prevents color banding like Apple TV / iOS) */
    .noise-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.032;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Minimal Intro Page */
    #login-view {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #08080a;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #login-view.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 380px;
      padding: 40px;
    }

    .spotify-logo-svg {
      width: 48px;
      height: 48px;
      fill: #1db954;
      margin-bottom: 24px;
    }

    .intro-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: #fff;
    }

    .intro-desc {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.45;
      margin-bottom: 32px;
    }

    .connect-spotify-btn {
      background: #1db954;
      color: #000;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 14px 34px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(29, 185, 84, 0.35);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .connect-spotify-btn:hover {
      background: #1ed760;
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(29, 185, 84, 0.48);
    }

    .connect-spotify-btn:active {
      transform: scale(0.97);
    }

    /* Main Lyrics & Player View */
    #player-view {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(320px, 40%) 1fr;
      padding: 50px 70px 40px 70px;
      gap: 50px;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #player-view.visible {
      opacity: 1;
    }

    /* Left Column: Artwork + Song Meta + Controls */
    .player-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 440px;
      width: 100%;
      margin: 0 auto 0 0;
      z-index: 20;
    }

    .album-art-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 48vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.75), 0 0 50px -12px var(--glow-color);
      transition: box-shadow 0.6s ease, transform 0.4s ease;
      background: rgba(255, 255, 255, 0.04);
    }

    .album-art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease;
    }

    .track-meta-section {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .track-title {
      font-size: clamp(1.4rem, 2.2vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.028em;
      line-height: 1.22;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-subtitle {
      font-size: clamp(0.95rem, 1.2vw, 1.15rem);
      font-weight: 500;
      letter-spacing: -0.012em;
      color: rgba(255, 255, 255, 0.68);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress & Scrubber */
    .playback-progress-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar-rail {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      cursor: pointer;
      padding: 6px 0;
      background-clip: content-box;
      transition: height 0.15s ease;
    }

    .progress-bar-rail:hover {
      height: 8px;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      pointer-events: none;
      transition: width 0.08s linear;
    }

    .progress-bar-thumb {
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }

    .progress-bar-rail:hover .progress-bar-thumb {
      transform: translateY(-50%) scale(1);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
    }

    /* Media Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 14px;
    }

    .media-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 50%;
      transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease;
    }

    .media-btn:hover {
      color: #fff;
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.08);
    }

    .media-btn.play-toggle {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .media-btn.play-toggle:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: scale(1.08);
    }

    /* Top/Bottom Toolbars */
    .top-actions-bar {
      position: absolute;
      top: 36px;
      right: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Right Column: Live Lyrics */
    .lyrics-column {
      position: relative;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
    }

    .lyrics-scroll-box {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding-top: 30vh;
      padding-bottom: 35vh;
      padding-right: 18px;
      scrollbar-width: none;
    }

    .lyrics-scroll-box::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: clamp(1.85rem, 2.75vw, 2.95rem);
      font-weight: 700;
      line-height: 1.34;
      letter-spacing: -0.024em;
      color: var(--text-inactive);
      margin: 22px 0;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      filter: blur(0.5px);
      transform: scale(0.96) translateX(-4px);
      transform-origin: left center;
      transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  text-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lyric-line:hover {
      color: rgba(255, 255, 255, 0.72);
      filter: blur(0px);
      background: rgba(255, 255, 255, 0.035);
    }

    .lyric-line.active {
      color: var(--text-active);
      font-weight: 800;
      filter: blur(0px);
      transform: scale(1.025) translateX(0);
      text-shadow: 0 0 32px rgba(255, 255, 255, 0.3);
    }

    /* Word-by-word karaoke illumination */
    .lyric-line .word {
      display: inline-block;
      white-space: pre;
      transition: color 0.15s ease, opacity 0.15s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lyric-line.active .word.passed {
      color: #ffffff;
      opacity: 1;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .lyric-line.active .word.current {
      color: #ffffff;
      opacity: 1;
      transform: scale(1.06);
      text-shadow: 0 0 32px rgba(255, 255, 255, 0.85);
    }

    .lyric-line.active .word.future {
      color: var(--text-future-word);
      opacity: 0.48;
    }

    /* State messages (Standby, Instrumental, Not Found) */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-left: 10px;
    }

    .empty-state-title {
      font-size: clamp(2rem, 3.2vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .empty-state-desc {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
    }

    /* Auto-scroll resume floating prompt */
    #resume-scroll-pill {
      position: absolute;
      bottom: 28px;
      right: 48px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 60;
    }

    #resume-scroll-pill.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Responsive Adaptation */
    @media (max-width: 960px) {
      #player-view {
        grid-template-columns: 1fr;
        padding: 30px 24px 20px 24px;
        gap: 30px;
        overflow-y: auto;
      }
      .player-column {
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .album-art-card {
        max-width: 260px;
      }
      .track-meta-section {
        align-items: center;
      }
      .playback-progress-section {
        width: 100%;
        max-width: 320px;
      }
      .lyrics-column {
        height: 60vh;
      }
      .lyrics-scroll-box {
        padding-top: 15vh;
        padding-bottom: 25vh;
      }
      .lyric-line {
        font-size: 1.85rem;
        text-align: center;
        transform-origin: center center;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Ambient Liquid Background -->
  <div class="ambient-container" id="ambient-container">
    <div class="ambient-blob blob-1" id="blob-1"></div>
    <div class="ambient-blob blob-2" id="blob-2"></div>
    <div class="ambient-blob blob-3" id="blob-3"></div>
  </div>
  <div class="vignette-overlay"></div>
  <div class="noise-overlay"></div>

  <!-- Minimal Intro Screen -->
  <div id="login-view">
    <div class="intro-card">
      <svg class="spotify-logo-svg" viewBox="0 0 24 24">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.306c-.215.353-.674.464-1.026.249-2.812-1.718-6.353-2.106-10.525-1.153-.404.093-.807-.156-.9-.56-.093-.404.156-.807.56-.9 4.568-1.045 8.498-.6 11.642 1.338.352.215.464.674.249 1.026zm1.468-3.262c-.27.44-.847.58-1.287.31-3.218-1.978-8.125-2.55-11.93-1.394-.498.15-1.03-.134-1.18-.632-.152-.498.133-1.03.63-1.18 4.356-1.322 9.775-.68 13.457 1.61.44.27.58.846.31 1.286zm.126-3.398C15.234 8.358 8.87 8.148 5.163 9.274c-.595.18-1.222-.16-1.403-.755-.18-.595.16-1.223.755-1.403 4.26-1.293 11.29-1.05 15.748 1.597.535.318.71 1.012.392 1.547-.318.535-1.012.71-1.547.392z"/>
      </svg>
      <h1 class="intro-title">Live Lyrics</h1>
      <p class="intro-desc">Connect with Spotify to experience synchronized, artist-accurate live lyrics.</p>
      <button class="connect-spotify-btn" id="login-btn">Connect Spotify</button>
    </div>
  </div>

  <!-- Main View -->
  <div id="player-view">
    <!-- Top Action Toolbar -->
    <div class="top-actions-bar">
      <!-- Adlib Filter Toggle -->
      <button class="pill-btn active" id="adlib-toggle-btn" title="Toggle adlib filtering">
        <span>Adlibs: Excluded</span>
      </button>

      <!-- Micro Sync Fine Tuner -->
      <div class="pill-btn" style="cursor: default;">
        <span style="cursor: pointer; padding: 0 4px; font-weight:800;" id="offset-minus" title="Shift -50ms">−</span>
        <span id="offset-display" title="Manual latency offset">Sync: 0.0s</span>
        <span style="cursor: pointer; padding: 0 4px; font-weight:800;" id="offset-plus" title="Shift +50ms">+</span>
      </div>

      <!-- Fullscreen Toggle -->
      <button class="pill-btn" id="fullscreen-btn" title="Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Disconnect -->
      <button class="pill-btn" id="logout-btn" title="Disconnect Account">Disconnect</button>
    </div>

    <!-- Left Column: Album Art, Info & Controls -->
    <div class="player-column">
      <div class="album-art-card">
        <img id="album-cover" src="" alt="Album Artwork">
      </div>

      <div class="track-meta-section">
        <div class="track-title" id="track-title">Connecting...</div>
        <div class="track-subtitle" id="track-subtitle">Start playback on Spotify</div>
      </div>

      <div class="playback-progress-section">
        <div class="progress-bar-rail" id="progress-rail">
          <div class="progress-bar-fill" id="progress-fill">
            <div class="progress-bar-thumb"></div>
          </div>
        </div>
        <div class="time-labels">
          <span id="time-current">0:00</span>
          <span id="time-total" title="Click to toggle remaining time">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <!-- Prev Track -->
        <button class="media-btn" id="prev-btn" title="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <!-- Play / Pause -->
        <button class="media-btn play-toggle" id="play-btn" title="Play/Pause">
          <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <!-- Next Track -->
        <button class="media-btn" id="next-btn" title="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Right Column: Apple Music Synchronized Lyrics -->
    <div class="lyrics-column">
      <div class="lyrics-scroll-box" id="lyrics-container">
        <!-- Lyrics lines injected dynamically -->
      </div>
      <button id="resume-scroll-pill">Resume Auto-Scroll</button>
    </div>
  </div>

  <!-- Offscreen canvas for fast dynamic color extraction -->
  <canvas id="color-canvas" width="32" height="32" style="display: none;"></canvas>

  <script>
    /**
     * CONFIGURATION
     */
    const CLIENT_ID = 'c361237077b7462180c155eafff8aeda';
    
    // Automatically match the production domain or local test environment
    const REDIRECT_URI = (window.location.hostname.includes('thisisthewebsite.github.io') || window.location.hostname === '')
      ? 'https://thisisthewebsite.github.io/'
      : window.location.origin + window.location.pathname;

    const SCOPES = [
      'user-read-currently-playing',
      'user-read-playback-state',
      'user-modify-playback-state'
    ].join(' ');

    /**
     * STATE
     */
    let accessToken = localStorage.getItem('spotify_access_token') || null;
    let refreshToken = localStorage.getItem('spotify_refresh_token') || null;
    let tokenExpiresAt = parseInt(localStorage.getItem('spotify_token_expires_at') || '0', 10);

    let currentTrackId = null;
    let currentTrackDuration = 0;
    let lastServerProgress = 0;
    let lastPollTimestamp = 0;
    let isPlaying = false;
    let syncOffsetMs = parseInt(localStorage.getItem('lyrics_sync_offset') || '0', 10);
    let excludeAdlibs = localStorage.getItem('exclude_adlibs') !== 'false'; // default true
    let showRemainingTime = false;

    let parsedLyrics = []; // [{ time: number, text: string, words: [{time, text}] }]
    let activeLineIndex = -1;
    let isUserScrolling = false;
    let userScrollTimer = null;
    let pollingInterval = null;

    /**
     * DOM ELEMENTS
     */
    const loginView = document.getElementById('login-view');
    const playerView = document.getElementById('player-view');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const albumCover = document.getElementById('album-cover');
    const trackTitle = document.getElementById('track-title');
    const trackSubtitle = document.getElementById('track-subtitle');
    const progressFill = document.getElementById('progress-fill');
    const progressRail = document.getElementById('progress-rail');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const lyricsContainer = document.getElementById('lyrics-container');
    const resumeScrollPill = document.getElementById('resume-scroll-pill');
    const adlibToggleBtn = document.getElementById('adlib-toggle-btn');
    const offsetMinusBtn = document.getElementById('offset-minus');
    const offsetPlusBtn = document.getElementById('offset-plus');
    const offsetDisplay = document.getElementById('offset-display');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const colorCanvas = document.getElementById('color-canvas');
    const canvasCtx = colorCanvas.getContext('2d', { willReadFrequently: true });

    /**
     * PKCE OAUTH IMPLEMENTATION
     */
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], '');
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64urlEncode(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    async function redirectToSpotifyAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64urlEncode(hashed);

      localStorage.setItem('spotify_code_verifier', codeVerifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function handleAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        console.error('Spotify Auth error:', error);
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }

      if (!code) return;

      const codeVerifier = localStorage.getItem('spotify_code_verifier');
      if (!codeVerifier) return;

      try {
        const body = new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier
        });

        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString()
        });

        const data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          refreshToken = data.refresh_token || refreshToken;
          tokenExpiresAt = Date.now() + (data.expires_in * 1000);

          localStorage.setItem('spotify_access_token', accessToken);
          if (data.refresh_token) localStorage.setItem('spotify_refresh_token', refreshToken);
          localStorage.setItem('spotify_token_expires_at', tokenExpiresAt.toString());
          localStorage.removeItem('spotify_code_verifier');

          window.history.replaceState({}, document.title, window.location.pathname);
          initPlayerApp();
        }
      } catch (err) {
        console.error('Failed to exchange PKCE token:', err);
      }
    }

    async function refreshAccessToken() {
      if (!refreshToken) return false;
      try {
        const body = new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: refreshToken
        });

        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString()
        });

        const data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          tokenExpiresAt = Date.now() + (data.expires_in * 1000);
          localStorage.setItem('spotify_access_token', accessToken);
          localStorage.setItem('spotify_token_expires_at', tokenExpiresAt.toString());
          if (data.refresh_token) {
            refreshToken = data.refresh_token;
            localStorage.setItem('spotify_refresh_token', refreshToken);
          }
          return true;
        }
      } catch (err) {
        console.error('Failed to refresh token:', err);
      }
      return false;
    }

    function checkAuthValid() {
      return accessToken && Date.now() < tokenExpiresAt - 60000;
    }

    /**
     * ADLIB EXCLUSION ENGINE
     */
    const ADLIB_WORDS = 'yeah|yea|ya|yup|uh|uhh|huh|mm|mmm|mhm|ahh|ah|oh|ooh|woah|whoa|ayy|ay|eyy|ey|woo|woop|skrrt|skrr|brr|brrr|sheesh|haha|ha|yo|hey|ok|okay|let\'s go|lets go|c\'mon|come on|hol\' up|hold up|what|damn|nah|la|da|dum|la-la|na-na';
    const standaloneAdlibRe = new RegExp(`^\\s*[\\(\\[\\{]?(?:(?:\\b(?:${ADLIB_WORDS})\\b)[\\s,\\.\\?!~-]*)+[\\)\\]\\}]?\\s*$`, 'i');
    const inlineAdlibRe = new RegExp(`[\\(\\[\\{]\\s*(?:(?:\\b(?:${ADLIB_WORDS})\\b)[\\s,\\.\\?!~-]*)+[\\)\\]\\}]`, 'gi');
    const repeatedEchoRe = new RegExp(`[\\(\\[\\{]\\s*(\\b\\w+\\b)(?:[\\s,]+\\1)+\\s*[\\)\\]\\}]`, 'gi');

    function cleanLyricText(rawText) {
      if (!excludeAdlibs) return rawText.trim();
      let text = rawText.trim();
      if (standaloneAdlibRe.test(text)) return '';
      if (repeatedEchoRe.test(text)) return '';
      text = text.replace(inlineAdlibRe, '');
      text = text.replace(repeatedEchoRe, '');
      text = text.replace(/\s{2,}/g, ' ').trim();
      return text;
    }

    /**
     * LYRICS FETCHER (LRCLIB + Karalyr + Fallbacks)
     */
    function cleanSearchTitle(title) {
      let t = title.replace(/\s*[\(\[](?:feat\.|featuring|with|prod\.)[^\]\)]+[\)\]]/gi, '');
      t = t.replace(/\s*-\s*(?:remastered|bonus track|radio edit|original mix|extended mix|single version|acoustic|deluxe).*/gi, '');
      t = t.replace(/\s*[\(\[](?:explicit|clean|remastered|deluxe edition|bonus track|anniversary edition)[\)\]]/gi, '');
      return t.trim();
    }

    function parseLrc(lrcText) {
      const lines = [];
      const rawLines = lrcText.split('\n');

      for (let raw of rawLines) {
        raw = raw.trim();
        if (!raw) continue;

        // Match [mm:ss.xx]
        const match = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
        if (!match) continue;

        const minutes = parseFloat(match[1]);
        const seconds = parseFloat(match[2]);
        const lineTime = minutes * 60 + seconds;
        const content = match[3];

        // Parse word tags <mm:ss.xx> if present (Enhanced LRC)
        const wordMatches = [...content.matchAll(/<(\d+):(\d+(?:\.\d+)?)>([^<]+)/g)];
        let words = [];

        if (wordMatches.length > 0) {
          for (let wm of wordMatches) {
            const wTime = parseFloat(wm[1]) * 60 + parseFloat(wm[2]);
            const wRaw = wm[3];
            const wClean = excludeAdlibs ? cleanLyricText(wRaw) : wRaw;
            if (wClean) words.push({ time: wTime, text: wClean });
          }
        }

        const plainClean = cleanLyricText(content.replace(/<[^>]+>/g, ''));
        if (!plainClean) continue;

        // If no word-by-word timestamps exist, distribute syllables proportionally
        if (words.length === 0) {
          const tokens = plainClean.split(/(\s+)/);
          words = tokens.filter(t => t.trim().length > 0).map(t => ({ text: t }));
        }

        lines.push({
          time: lineTime,
          text: plainClean,
          words: words,
          hasWordTiming: wordMatches.length > 0
        });
      }

      // Estimate word time ranges for standard LRC
      for (let i = 0; i < lines.length; i++) {
        const cur = lines[i];
        if (!cur.hasWordTiming && cur.words.length > 0) {
          const nextTime = (i + 1 < lines.length) ? lines[i + 1].time : (cur.time + 4.5);
          const duration = Math.max(1.2, Math.min(nextTime - cur.time, 6.0));
          const totalChars = cur.words.reduce((sum, w) => sum + w.text.length, 0);
          let elapsed = 0;

          cur.words.forEach((w) => {
            const wordDuration = (w.text.length / totalChars) * duration;
            w.time = cur.time + elapsed;
            w.endTime = w.time + wordDuration;
            elapsed += wordDuration;
          });
        }
      }

      return lines.sort((a, b) => a.time - b.time);
    }

    async function fetchLyrics(track, artist, album, durationSec) {
      const cleanTitle = cleanSearchTitle(track);
      const cleanArtist = artist.split(',')[0].trim();

      // Tier 1: LRCLIB Exact Query
      try {
        const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(cleanArtist)}&duration=${Math.round(durationSec)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data.syncedLyrics) return parseLrc(data.syncedLyrics);
        }
      } catch (e) {}

      // Tier 2: LRCLIB Search Query
      try {
        const searchUrl = `https://lrclib.net/api/search?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(cleanArtist)}`;
        const res = await fetch(searchUrl);
        if (res.ok) {
          const items = await res.json();
          const synced = items.find(item => item.syncedLyrics);
          if (synced) return parseLrc(synced.syncedLyrics);
        }
      } catch (e) {}

      // Tier 3: Karalyr Word-Synced Engine
      try {
        const karaUrl = `https://karalyr.com/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTitle)}&duration=${Math.round(durationSec)}`;
        const res = await fetch(karaUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.syncedLyrics) return parseLrc(data.syncedLyrics);
        }
      } catch (e) {}

      return [];
    }

    /**
     * DYNAMIC COLOR EXTRACTION FOR AMBIENT BACKDROP
     */
    function extractDynamicColors(imgElement) {
      try {
        canvasCtx.drawImage(imgElement, 0, 0, 32, 32);
        const data = canvasCtx.getImageData(0, 0, 32, 32).data;
        const colors = [];

        for (let i = 0; i < data.length; i += 40) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const brightness = (r * 299 + g * 587 + b * 114) / 1000;
          if (brightness > 20 && brightness < 220) {
            colors.push({ r, g, b, brightness });
          }
        }

        if (colors.length >= 3) {
          const c1 = colors[Math.floor(colors.length * 0.2)];
          const c2 = colors[Math.floor(colors.length * 0.5)];
          const c3 = colors[Math.floor(colors.length * 0.8)];

          document.getElementById('blob-1').style.background = `radial-gradient(circle, rgba(${c1.r},${c1.g},${c1.b},0.8) 0%, transparent 70%)`;
          document.getElementById('blob-2').style.background = `radial-gradient(circle, rgba(${c2.r},${c2.g},${c2.b},0.75) 0%, transparent 70%)`;
          document.getElementById('blob-3').style.background = `radial-gradient(circle, rgba(${c3.r},${c3.g},${c3.b},0.6) 0%, transparent 70%)`;
          document.documentElement.style.setProperty('--glow-color', `rgba(${c1.r},${c1.g},${c1.b},0.45)`);
        }
      } catch (e) {}
    }

    /**
     * SPOTIFY PLAYBACK POLLING
     */
    async function pollPlayback() {
      if (!checkAuthValid()) {
        const refreshed = await refreshAccessToken();
        if (!refreshed) {
          showLogin();
          return;
        }
      }

      const requestStart = performance.now();

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        if (res.status === 204 || res.status === 202) {
          renderNoTrackPlaying();
          return;
        }

        if (res.status === 401) {
          await refreshAccessToken();
          return;
        }

        const data = await res.json();
        if (!data || !data.item) {
          renderNoTrackPlaying();
          return;
        }

        const roundTripTime = performance.now() - requestStart;
        const latencyCompensation = roundTripTime / 2;

        isPlaying = data.is_playing;
        lastServerProgress = data.progress_ms + latencyCompensation;
        lastPollTimestamp = performance.now();
        currentTrackDuration = data.item.duration_ms;

        updatePlayPauseButton(isPlaying);

        if (data.item.id !== currentTrackId) {
          currentTrackId = data.item.id;
          handleTrackChange(data.item);
        }
      } catch (err) {
        console.error('Playback poll error:', err);
      }
    }

    async function handleTrackChange(trackItem) {
      trackTitle.textContent = trackItem.name;
      trackSubtitle.textContent = `${trackItem.artists.map(a => a.name).join(', ')} — ${trackItem.album.name}`;

      const highResArt = trackItem.album.images[0]?.url || '';
      albumCover.crossOrigin = 'Anonymous';
      albumCover.src = highResArt;
      albumCover.onload = () => extractDynamicColors(albumCover);

      lyricsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-title">Loading lyrics...</div>
          <div class="empty-state-desc">Synchronizing with Spotify</div>
        </div>
      `;

      parsedLyrics = [];
      activeLineIndex = -1;

      const durationSec = trackItem.duration_ms / 1000;
      const lyrics = await fetchLyrics(
        trackItem.name,
        trackItem.artists[0]?.name || '',
        trackItem.album.name || '',
        durationSec
      );

      if (trackItem.id !== currentTrackId) return; // Discard if track switched during fetch

      parsedLyrics = lyrics;
      renderLyricsDOM();
    }

    function renderNoTrackPlaying() {
      trackTitle.textContent = 'Spotify Standby';
      trackSubtitle.textContent = 'Play music on any connected Spotify device';
      lyricsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-title">No song playing</div>
          <div class="empty-state-desc">Start playing a track on Spotify to display live lyrics</div>
        </div>
      `;
    }

    function renderLyricsDOM() {
      if (!parsedLyrics || parsedLyrics.length === 0) {
        lyricsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Lyrics Unavailable</div>
            <div class="empty-state-desc">No synchronized lyrics found for this track.</div>
          </div>
        `;
        return;
      }

      lyricsContainer.innerHTML = '';
      parsedLyrics.forEach((line, idx) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'lyric-line';
        lineEl.dataset.index = idx;
        lineEl.dataset.time = line.time;

        // Render words inside line
        line.words.forEach((w) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.textContent = w.text + ' ';
          lineEl.appendChild(wordSpan);
        });

        // Click to seek directly to timestamp
        lineEl.addEventListener('click', () => {
          seekToPosition(Math.floor(line.time * 1000));
        });

        lyricsContainer.appendChild(lineEl);
      });

      isUserScrolling = false;
      resumeScrollPill.classList.remove('show');
    }

    /**
     * HIGH PRECISION CLOCK & ANIMATION LOOP (ZERO DELAY)
     */
    function getCurrentAccurateMs() {
      if (!isPlaying) return lastServerProgress + syncOffsetMs;
      const elapsed = performance.now() - lastPollTimestamp;
      return lastServerProgress + elapsed + syncOffsetMs;
    }

    function formatTime(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const mins = Math.floor(s / 60);
      const remSecs = s % 60;
      return `${mins}:${remSecs < 10 ? '0' : ''}${remSecs}`;
    }

    function animationTick() {
      requestAnimationFrame(animationTick);

      const currentMs = getCurrentAccurateMs();
      const currentSec = currentMs / 1000;

      // Update progress bar
      if (currentTrackDuration > 0) {
        const pct = Math.min(100, Math.max(0, (currentMs / currentTrackDuration) * 100));
        progressFill.style.width = `${pct}%`;
        timeCurrent.textContent = formatTime(currentSec);

        if (showRemainingTime) {
          const remaining = (currentTrackDuration - currentMs) / 1000;
          timeTotal.textContent = `-${formatTime(remaining)}`;
        } else {
          timeTotal.textContent = formatTime(currentTrackDuration / 1000);
        }
      }

      if (parsedLyrics.length === 0) return;

      // Find current active line
      let newActiveIndex = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentSec >= parsedLyrics[i].time) {
          newActiveIndex = i;
        } else {
          break;
        }
      }

      // Update active line styling & auto-scroll
      if (newActiveIndex !== activeLineIndex) {
        const lineElements = lyricsContainer.children;
        if (lineElements[activeLineIndex]) {
          lineElements[activeLineIndex].classList.remove('active');
          const words = lineElements[activeLineIndex].querySelectorAll('.word');
          words.forEach(w => w.className = 'word');
        }

        activeLineIndex = newActiveIndex;

        if (lineElements[activeLineIndex]) {
          const currentLineEl = lineElements[activeLineIndex];
          currentLineEl.classList.add('active');

          if (!isUserScrolling) {
            scrollLineToActivePosition(currentLineEl);
          }
        }
      }

      // High-precision word-by-word progressive illumination
      if (activeLineIndex >= 0 && activeLineIndex < parsedLyrics.length) {
        const currentLine = parsedLyrics[activeLineIndex];
        const lineEl = lyricsContainer.children[activeLineIndex];
        if (lineEl) {
          const wordSpans = lineEl.querySelectorAll('.word');

          currentLine.words.forEach((w, wIdx) => {
            const span = wordSpans[wIdx];
            if (!span) return;

            const wStart = w.time;
            const wEnd = w.endTime || (wStart + 0.4);

            if (currentSec > wEnd) {
              span.className = 'word passed';
            } else if (currentSec >= wStart && currentSec <= wEnd) {
              span.className = 'word current';
            } else {
              span.className = 'word future';
            }
          });
        }
      }
    }

    function scrollLineToActivePosition(lineEl) {
      const containerHeight = lyricsContainer.clientHeight;
      const targetScroll = lineEl.offsetTop - (containerHeight * 0.34);
      lyricsContainer.scrollTo({
        top: Math.max(0, targetScroll),
        behavior: 'smooth'
      });
    }

    /**
     * SPOTIFY PLAYER CONTROLS
     */
    async function sendPlayerCommand(endpoint, method = 'PUT', body = null) {
      if (!checkAuthValid()) await refreshAccessToken();
      try {
        await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
          method: method,
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: body ? JSON.stringify(body) : null
        });
        setTimeout(pollPlayback, 300);
      } catch (e) {
        console.error('Player command failed:', e);
      }
    }

    async function seekToPosition(positionMs) {
      lastServerProgress = positionMs;
      lastPollTimestamp = performance.now();
      await sendPlayerCommand(`seek?position_ms=${positionMs}`);
    }

    function updatePlayPauseButton(playing) {
      if (playing) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    /**
     * USER INTERACTION HANDLERS
     */
    loginBtn.addEventListener('click', redirectToSpotifyAuth);

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      window.location.reload();
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        sendPlayerCommand('pause');
        isPlaying = false;
        updatePlayPauseButton(false);
      } else {
        sendPlayerCommand('play');
        isPlaying = true;
        updatePlayPauseButton(true);
      }
    });

    prevBtn.addEventListener('click', () => sendPlayerCommand('previous', 'POST'));
    nextBtn.addEventListener('click', () => sendPlayerCommand('next', 'POST'));

    timeTotal.addEventListener('click', () => {
      showRemainingTime = !showRemainingTime;
    });

    progressRail.addEventListener('click', (e) => {
      const rect = progressRail.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      const targetMs = Math.floor(pct * currentTrackDuration);
      seekToPosition(targetMs);
    });

    // Detect user manual scroll to avoid viewport jumpiness
    lyricsContainer.addEventListener('wheel', handleUserScroll, { passive: true });
    lyricsContainer.addEventListener('touchmove', handleUserScroll, { passive: true });

    function handleUserScroll() {
      isUserScrolling = true;
      resumeScrollPill.classList.add('show');
      clearTimeout(userScrollTimer);
      userScrollTimer = setTimeout(() => {
        isUserScrolling = false;
        resumeScrollPill.classList.remove('show');
      }, 4500);
    }

    resumeScrollPill.addEventListener('click', () => {
      isUserScrolling = false;
      resumeScrollPill.classList.remove('show');
      const lineElements = lyricsContainer.children;
      if (lineElements[activeLineIndex]) {
        scrollLineToActivePosition(lineElements[activeLineIndex]);
      }
    });

    // Adlib Exclusion Toggle
    adlibToggleBtn.addEventListener('click', () => {
      excludeAdlibs = !excludeAdlibs;
      localStorage.setItem('exclude_adlibs', excludeAdlibs);
      adlibToggleBtn.classList.toggle('active', excludeAdlibs);
      adlibToggleBtn.querySelector('span').textContent = excludeAdlibs ? 'Adlibs: Excluded' : 'Adlibs: Included';
      if (currentTrackId) {
        handleTrackChange({
          id: currentTrackId,
          name: trackTitle.textContent,
          artists: [{ name: trackSubtitle.textContent.split('—')[0].trim() }],
          album: { name: trackSubtitle.textContent.split('—')[1]?.trim() || '', images: [{ url: albumCover.src }] },
          duration_ms: currentTrackDuration
        });
      }
    });

    // Sync Offset Calibration
    function updateOffsetDisplay() {
      const sec = (syncOffsetMs / 1000).toFixed(1);
      offsetDisplay.textContent = `Sync: ${syncOffsetMs >= 0 ? '+' : ''}${sec}s`;
      localStorage.setItem('lyrics_sync_offset', syncOffsetMs.toString());
    }

    offsetMinusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      syncOffsetMs -= 50;
      updateOffsetDisplay();
    });

    offsetPlusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      syncOffsetMs += 50;
      updateOffsetDisplay();
    });

    // Keyboard Shortcuts: '[' to decrease offset, ']' to increase offset, 'Space' to Play/Pause
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === '[') {
        syncOffsetMs -= 50;
        updateOffsetDisplay();
      } else if (e.key === ']') {
        syncOffsetMs += 50;
        updateOffsetDisplay();
      } else if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      }
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    /**
     * INITIALIZATION
     */
    function showLogin() {
      loginView.classList.remove('hidden');
      playerView.classList.remove('visible');
      if (pollingInterval) clearInterval(pollingInterval);
    }

    function initPlayerApp() {
      loginView.classList.add('hidden');
      playerView.classList.add('visible');

      updateOffsetDisplay();
      adlibToggleBtn.classList.toggle('active', excludeAdlibs);
      adlibToggleBtn.querySelector('span').textContent = excludeAdlibs ? 'Adlibs: Excluded' : 'Adlibs: Included';

      pollPlayback();
      pollingInterval = setInterval(pollPlayback, 1500);
      requestAnimationFrame(animationTick);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.location.search.includes('code=')) {
        await handleAuthCallback();
      } else if (checkAuthValid() || refreshToken) {
        if (!checkAuthValid()) await refreshAccessToken();
        initPlayerApp();
      } else {
        showLogin();
      }
    });
  </script>
</body>
</html>
